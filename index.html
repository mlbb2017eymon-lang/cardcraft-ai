<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Presentation Studio — SaaS Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        .slide-aspect { aspect-ratio: 16 / 9; }
        .slide-overlay { background: linear-gradient(90deg, rgba(3,7,18,0.95) 0%, rgba(3,7,18,0.85) 50%, rgba(3,7,18,0.6) 100%); }
        
        /* Живой 3D-фон для авторизации */
        .live-3d-bg {
            background: radial-gradient(circle at 30% 30%, #4c1d95 0%, #1e1b4b 40%, #030712 90%);
            position: relative;
            overflow: hidden;
        }
        .live-3d-bg::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: rgba(168, 85, 247, 0.2);
            filter: blur(120px);
            top: -10%; left: -10%;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Состояния авторизации и кредитов
            const [user, setUser] = useState(() => localStorage.getItem('saas_user') || null);
            const [credits, setCredits] = useState(() => {
                const saved = localStorage.getItem('saas_credits');
                return saved !== null ? parseInt(saved, 10) : 3; // 3 бесплатных при старте
            });
            const [authEmail, setAuthEmail] = useState('');

            // Управление экранами: 'auth' | 'dashboard' | 'pricing'
            const [currentView, setCurrentView] = useState(() => localStorage.getItem('saas_user') ? 'dashboard' : 'auth');

            // Модальное окно настроек перед генерацией
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [topicInput, setTopicInput] = useState('');
            const [slideCount, setSlideCount] = useState('4');
            const [slideLang, setSlideLang] = useState('Русский');
            const [slideQuality, setSlideQuality] = useState('HD Pro');

            // Презентация
            const [isGenerating, setIsGenerating] = useState(false);
            const [slides, setSlides] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            useEffect(() => {
                localStorage.setItem('saas_credits', credits.toString());
                if (user) localStorage.setItem('saas_user', user);
                else localStorage.removeItem('saas_user');
            }, [credits, user]);

            // Авторизация
            const handleSignIn = (e) => {
                e.preventDefault();
                if (!authEmail.trim()) return;
                setUser(authEmail);
                setCurrentView('dashboard');
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('saas_user');
                setCurrentView('auth');
            };

            // Запуск модального окна настроек перед генерацией
            const handleStartGenerationPrompt = () => {
                if (!topicInput.trim()) return;
                if (credits <= 0) {
                    setCurrentView('pricing');
                    return;
                }
                setShowSettingsModal(true);
            };

            // Финальная генерация презентации
            const executeGeneration = () => {
                setShowSettingsModal(false);
                setIsGenerating(true);
                setCredits(prev => prev - 1); // Списываем 1 кредит

                setTimeout(() => {
                    const topic = topicInput.trim();
                    const count = parseInt(slideCount, 10) || 4;

                    const generated = [];
                    const bgImages = [
                        "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80",
                        "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1600&q=80",
                        "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80",
                        "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1600&q=80"
                    ];

                    for (let i = 0; i < count; i++) {
                        generated.push({
                            badge: `СЛАЙД 0${i + 1} / ${slideLang.toUpperCase()} / ${slideQuality}`,
                            title: i === 0 ? topic.toUpperCase() : `ЭТАП РАЗВИТИЯ #${i + 1}`,
                            subtitle: `Стратегический анализ и ключевые метрики проекта`,
                            bgImage: bgImages[i % bgImages.length],
                            accentColor: i % 2 === 0 ? "text-indigo-400" : "text-purple-400",
                            description: `Подробный разбор концепции "${topic}" с учетом актуальных трендов рынка на 2026 год. Высокая вовлеченность и конверсия.`,
                            metrics: [
                                { label: "Эффективность", value: `+${(i + 1) * 35}%` },
                                { label: "Охват аудитории", value: "94.2%" },
                                { label: "Качество", value: slideQuality }
                            ],
                            blocks: [
                                { head: "Ключевой фактор", text: "Полная автоматизация процессов и глубокая проработка структуры материала." },
                                { head: "Ожидаемый эффект", text: "Снижение затрат времени на подготовку в 4 раза при максимальной детализации." }
                            ]
                        });
                    }

                    setSlides(generated);
                    setCurrentSlideIndex(0);
                    setIsGenerating(false);
                }, 1200);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    
                    {/* ЭКРАН 1: АВТОРИЗАЦИЯ С ЖИВЫМ 3D ФОНОМ */}
                    {currentView === 'auth' && (
                        <div className="absolute inset-0 z-50 live-3d-bg flex items-center justify-center p-6">
                            <div className="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-purple-500/30 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
                                <div className="w-16 h-16 bg-gradient-to-tr from-purple-500 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black text-white shadow-lg shadow-purple-500/40">
                                    P
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-white">AI Presentation Studio</h1>
                                    <p className="text-xs text-purple-300 font-bold mt-1">Войдите в систему (доступно 3 бесплатных кредита)</p>
                                </div>

                                <form onSubmit={handleSignIn} className="space-y-4">
                                    <input 
                                        type="email"
                                        required
                                        value={authEmail}
                                        onChange={(e) => setAuthEmail(e.target.value)}
                                        placeholder="Введите ваш Email..."
                                        className="w-full bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-2xl px-5 py-3.5 text-sm text-white placeholder-slate-500 outline-none transition-all text-center"
                                    />
                                    <button 
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-2xl text-sm transition-all shadow-lg shadow-purple-600/40"
                                    >
                                        ✨ Войти / Начать работу
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ШАПКА САЙТА */}
                    <header className="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('dashboard')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    P
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">AI Presentation</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">SaaS Edition 2026</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setCurrentView('pricing')}
                                    className="bg-amber-500/10 border border-amber-500/40 hover:bg-amber-500/20 text-amber-400 text-xs font-bold px-4 py-2 rounded-xl transition-all"
                                >
                                    ⚡ Кредиты: {credits} / Подписка
                                </button>
                                {user && (
                                    <button 
                                        onClick={handleLogout}
                                        className="text-xs text-slate-400 hover:text-white bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl transition-all"
                                    >
                                        Выйти ({user})
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ОСНОВНОЙ КОНТЕНТ (РАБОЧЕЕ МЕСТО) */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-6 space-y-8">
                        
                        {currentView === 'dashboard' && (
                            <>
                                {/* Поле ввода темы */}
                                <div className="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4 backdrop-blur-md max-w-3xl mx-auto">
                                    <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider text-center">
                                        О чем создать презентацию? (ИИ сделает всё автоматически)
                                    </label>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <input 
                                            type="text"
                                            value={topicInput}
                                            onChange={(e) => setTopicInput(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleStartGenerationPrompt()}
                                            placeholder="Например: Запуск IT-стартапа, Криптоинвестиции, Маркетинг..."
                                            className="flex-1 bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-2xl px-5 py-3.5 text-sm text-white placeholder-slate-500 outline-none transition-all"
                                        />
                                        <button 
                                            onClick={handleStartGenerationPrompt}
                                            disabled={isGenerating || !topicInput.trim()}
                                            className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold px-8 py-3.5 rounded-2xl text-sm transition-all shadow-lg shadow-purple-600/35 whitespace-nowrap"
                                        >
                                            {isGenerating ? "🪄 Генерация..." : "🚀 Создать презентацию"}
                                        </button>
                                    </div>
                                </div>

                                {/* Отображение слайдов */}
                                {slides && (
                                    <div className="space-y-6">
                                        <div className="flex items-center justify-between bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                                            <div className="flex items-center gap-2 overflow-x-auto">
                                                {slides.map((s, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => setCurrentSlideIndex(idx)}
                                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${currentSlideIndex === idx ? 'bg-purple-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400'}`}
                                                    >
                                                        Слайд {idx + 1}
                                                    </button>
                                                ))}
                                            </div>
                                            <span className="text-xs font-bold text-purple-400">Слайд {currentSlideIndex + 1} из {slides.length}</span>
                                        </div>

                                        {/* Слайд холст */}
                                        <div className="flex justify-center">
                                            <div 
                                                className="w-full max-w-[1000px] slide-aspect rounded-3xl overflow-hidden border border-slate-700 shadow-2xl relative bg-cover bg-center flex flex-col justify-between p-8 sm:p-12"
                                                style={{ backgroundImage: `url('${slides[currentSlideIndex].bgImage}')` }}
                                            >
                                                <div className="absolute inset-0 slide-overlay pointer-events-none"></div>

                                                <div className="relative z-10 flex justify-between items-center border-b border-white/10 pb-4">
                                                    <span className="bg-purple-600 text-white text-[10px] font-black px-3.5 py-1.5 rounded-xl uppercase tracking-widest">
                                                        {slides[currentSlideIndex].badge}
                                                    </span>
                                                </div>

                                                <div className="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center my-auto py-4">
                                                    <div className="lg:col-span-7 space-y-4">
                                                        <h2 className="text-2xl sm:text-4xl font-black text-white leading-tight uppercase">
                                                            {slides[currentSlideIndex].title}
                                                        </h2>
                                                        <p className={`text-xs font-extrabold ${slides[currentSlideIndex].accentColor} uppercase`}>
                                                            {slides[currentSlideIndex].subtitle}
                                                        </p>
                                                        <p className="text-xs sm:text-sm text-slate-300 bg-slate-950/50 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                                            {slides[currentSlideIndex].description}
                                                        </p>
                                                    </div>

                                                    <div className="lg:col-span-5 space-y-3">
                                                        <div className="grid grid-cols-3 gap-2">
                                                            {slides[currentSlideIndex].metrics.map((m, i) => (
                                                                <div key={i} className="bg-slate-950/80 border border-white/10 p-2.5 rounded-xl text-center">
                                                                    <div className="text-xs sm:text-sm font-black text-white">{m.value}</div>
                                                                    <div className="text-[9px] text-slate-400 font-bold">{m.label}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <div className="space-y-2">
                                                            {slides[currentSlideIndex].blocks.map((b, i) => (
                                                                <div key={i} className="bg-slate-950/80 p-2.5 rounded-xl border border-white/10">
                                                                    <div className="text-[11px] font-bold text-amber-400">{b.head}</div>
                                                                    <div className="text-[10px] text-slate-300">{b.text}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="relative z-10 flex justify-between items-center text-[10px] text-slate-400 font-bold border-t border-white/10 pt-3">
                                                    <span>AI STUDIO ENGINE</span>
                                                    <span>{currentSlideIndex + 1} / {slides.length}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}

                        {/* ЭКРАН 2: ТРИ ТИПА ПОДПИСОК */}
                        {currentView === 'pricing' && (
                            <div className="max-w-4xl mx-auto space-y-8 py-6">
                                <div className="text-center space-y-2">
                                    <h2 className="text-3xl font-black text-white">Выберите тарифный план</h2>
                                    <p className="text-sm text-slate-400">У вас осталось кредитов: <span className="text-amber-400 font-bold">{credits}</span></p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {/* План 1 */}
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 text-center flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-purple-400 uppercase">Стартовый</span>
                                            <h3 className="text-2xl font-black text-white mt-1">15 кредитов</h3>
                                            <div className="text-xl font-bold text-amber-400 mt-2">$9 / мес</div>
                                            <p className="text-xs text-slate-400 mt-4">Идеально для регулярной быстрой генерации.</p>
                                        </div>
                                        <button onClick={() => { setCredits(15); setCurrentView('dashboard'); }} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition-all">
                                            Выбрать план
                                        </button>
                                    </div>

                                    {/* План 2 */}
                                    <div className="bg-gradient-to-b from-purple-900/40 to-slate-900 border border-purple-500 p-6 rounded-3xl space-y-4 text-center flex flex-col justify-between relative shadow-xl shadow-purple-950/50">
                                        <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-purple-600 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Хит продаж</span>
                                        <div>
                                            <span className="text-xs font-bold text-purple-300 uppercase">Профессиональный</span>
                                            <h3 className="text-2xl font-black text-white mt-1">50 кредитов</h3>
                                            <div className="text-xl font-bold text-amber-400 mt-2">$25 / мес</div>
                                            <p className="text-xs text-slate-300 mt-4">Расширенные настройки, HD качество и приоритет.</p>
                                        </div>
                                        <button onClick={() => { setCredits(50); setCurrentView('dashboard'); }} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-lg shadow-purple-600/40">
                                            Выбрать Про
                                        </button>
                                    </div>

                                    {/* План 3 */}
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 text-center flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-indigo-400 uppercase">Безлимитный</span>
                                            <h3 className="text-2xl font-black text-white mt-1">∞ Безлимит</h3>
                                            <div className="text-xl font-bold text-amber-400 mt-2">$59 / мес</div>
                                            <p className="text-xs text-slate-400 mt-4">Для агентств и продвинутых фрилансеров без ограничений.</p>
                                        </div>
                                        <button onClick={() => { setCredits(999); setCurrentView('dashboard'); }} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs transition-all">
                                            Выбрать Безлимит
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* МОДАЛЬНОЕ ОКНО НАСТРОЕК ПЕРЕД ГЕНЕРАЦИЕЙ */}
                    {showSettingsModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-slate-900 border border-purple-500/40 p-6 rounded-3xl shadow-2xl space-y-5">
                                <h3 className="text-lg font-black text-white uppercase">⚙️ Настройки генерации</h3>
                                
                                <div className="space-y-4 text-xs">
                                    <div>
                                        <label className="text-slate-400 font-bold block mb-1">Количество слайдов:</label>
                                        <select value={slideCount} onChange={(e) => setSlideCount(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none">
                                            <option value="3">3 Слайда</option>
                                            <option value="4">4 Слайда (Оптимально)</option>
                                            <option value="6">6 Слайдов</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-slate-400 font-bold block mb-1">Язык презентации:</label>
                                        <select value={slideLang} onChange={(e) => setSlideLang(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none">
                                            <option value="Русский">Русский</option>
                                            <option value="English">English</option>
                                            <option value="O'zbekcha">O'zbekcha</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-slate-400 font-bold block mb-1">Качество визуализации:</label>
                                        <select value={slideQuality} onChange={(e) => setSlideQuality(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none">
                                            <option value="HD Pro">HD Pro (Стандарт)</option>
                                            <option value="Ultra 4K">Ultra 4K (Премиум)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => setShowSettingsModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-all">
                                        Отмена
                                    </button>
                                    <button onClick={executeGeneration} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-lg shadow-purple-600/40">
                                        Запустить (1 кредит)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        AI Presentation SaaS Studio © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(address = document.getElementById('root') || document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
