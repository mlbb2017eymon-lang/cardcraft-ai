<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft AI — E-commerce Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
            CardCraft AI <span class="text-xs px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">E-commerce Studio</span>
        </h1>
        
        <div id="auth-status" class="flex items-center gap-4">
            <span class="text-sm text-slate-400">Загрузка...</span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <div id="login-card" class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
            <h2 class="text-lg font-semibold text-white mb-2">Вход / Регистрация</h2>
            <p class="text-sm text-slate-400 mb-6">Получите 3 бесплатные генерации сразу после входа!</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <input type="email" id="email-input" required placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" id="login-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-medium rounded-lg transition-colors">
                    Войти по Email
                </button>
            </form>
            <div id="auth-message" class="mt-4 text-sm text-center text-red-400 hidden"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl min-h-[300px]">
            <h2 class="text-lg font-semibold text-white mb-4">Результат</h2>
            <p class="text-slate-500 text-sm">Заполните форму и нажмите генерацию для получения карточки товара</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://zecwwgefsbpiadifnnuc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2OTM5MTUsImV4cCI6MjA3MzI2OTkxNX0.EXX_3w3-placeholder';eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg

        let supabase = null;
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const authStatus = document.getElementById('auth-status');
        const loginCard = document.getElementById('login-card');
        const loginForm = document.getElementById('login-form');
        const authMessage = document.getElementById('auth-message');

        async function checkUser() {
            if (!supabase) return;
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                const { data: profile } = await supabase.from('profiles').select('credits').eq('id', user.id).single();
                const credits = profile ? profile.credits : 0;

                authStatus.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="bg-indigo-950 text-indigo-300 border border-indigo-800 px-3 py-1 rounded-full text-xs font-semibold">⚡ ${credits} кредитов</span>
                        <span class="text-sm text-slate-300">${user.email}</span>
                        <button onclick="logout()" class="text-xs text-slate-400 hover:text-white underline">Выйти</button>
                    </div>
                `;
                loginCard.classList.add('hidden');
            } else {
                authStatus.innerHTML = `<span class="text-sm text-slate-400">Войдите для доступа</span>`;
                loginCard.classList.remove('hidden');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            authMessage.classList.add('hidden');
            
            const { error } = await supabase.auth.signInWithOtp({ email });
            
            if (error) {
                authMessage.innerText = 'Ошибка: ' + error.message;
                authMessage.classList.remove('hidden');
            } else {
                alert('Ссылка для входа отправлена на ваш email!');
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            checkUser();
        }

        checkUser();
    </script>
</body>
</html>
