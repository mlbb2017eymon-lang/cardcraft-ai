<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft AI — Part 3: Studio & Overlay Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        .checkerboard {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://zecwwgefsbpiadifnnuc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [credits, setCredits] = useState(() => {
                const saved = localStorage.getItem('cc_credits');
                return saved !== null ? parseInt(saved, 10) : 15;
            });
            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('cc_tab') || 'mixer');
            
            // Вырезанное фото
            const [processedImage, setProcessedImage] = useState(() => localStorage.getItem('cc_processed_img') || null);
            const [isProcessingImg, setIsProcessingImg] = useState(false);

            // Сохраненные слайды серии
            const [generatedSeries, setGeneratedSeries] = useState(() => {
                const saved = localStorage.getItem('cc_series');
                return saved ? JSON.parse(saved) : [
                    {
                        badge: "ХИТ ПРОДАЖ",
                        mainTitle: "ВЕНТИЛЯТОР",
                        subTitle: "ФЛАГМАН 2026",
                        bullets: ["Гарантия высочайшего качества", "Быстрая доставка по стране", "Специальное предложение"],
                        bgUrl: "https://image.pollinations.ai/prompt/empty%20dark%20purple%20neon%203d%20podium%20pedestal%20futuristic%20studio%20setup?width=900&height=1200&seed=777&nologo=true"
                    },
                    {
                        badge: "ХАРАКТЕРИСТИКИ",
                        mainTitle: "МОЩНЫЙ И ТИХИЙ",
                        subTitle: "ПРЕМИУМ МАТЕРИАЛЫ",
                        bullets: ["3 режима скорости", "Бесшумный мотор", "Автономность до 12 часов"],
                        bgUrl: "https://image.pollinations.ai/prompt/empty%20cyan%20blue%20glowing%203d%20pedestal%20cyberpunk%20studio?width=900&height=1200&seed=888&nologo=true"
                    }
                ];
            });

            const [activeSlideIndex, setActiveSlideIndex] = useState(0);

            useEffect(() => {
                localStorage.setItem('cc_credits', credits.toString());
                localStorage.setItem('cc_tab', activeTab);
                if (processedImage) localStorage.setItem('cc_processed_img', processedImage);
                else localStorage.removeItem('cc_processed_img');
                localStorage.setItem('cc_series', JSON.stringify(generatedSeries));
            }, [credits, activeTab, processedImage, generatedSeries]);

            const removeBackgroundCanvas = (imageSrc) => {
                setIsProcessingImg(true);
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = imageSrc;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        if (r > 225 && g > 225 && b > 225) {
                            data[i + 3] = 0;
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    setProcessedImage(canvas.toDataURL('image/png'));
                    setIsProcessingImg(false);
                };
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => removeBackgroundCanvas(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const activeSlide = generatedSeries[activeSlideIndex] || generatedSeries[0];

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    <div className="bg-glow w-[600px] h-[600px] bg-purple-600 -top-40 -left-40"></div>

                    {/* Навигация */}
                    <header className="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('mixer')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    C
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">CardCraft AI</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">Studio & Renderer v4.0</span>
                                </div>
                            </div>

                            <nav className="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                                <button 
                                    onClick={() => setActiveTab('mixer')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'mixer' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🪄 ИИ-Миксер
                                </button>
                                <button 
                                    onClick={() => setActiveTab('studio')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'studio' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🖼️ 3D Студия ({generatedSeries.length})
                                </button>
                            </nav>

                            <div className="flex items-center gap-3">
                                <div className="bg-purple-950/80 border border-purple-800/60 px-4 py-2 rounded-xl text-xs font-bold text-purple-300">
                                    ⚡ {credits} Кредитов
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Рабочая область */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-6">
                        {activeTab === 'mixer' && (
                            <div className="max-w-3xl mx-auto bg-slate-900/90 border border-slate-800 p-8 rounded-3xl space-y-6">
                                <h2 className="text-xl font-black text-white">Модуль 2: Фото товара с прозрачным фоном</h2>
                                <div className="border-2 border-dashed border-slate-700 rounded-2xl p-6 text-center bg-slate-950/50">
                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" id="file-in" />
                                    <label htmlFor="file-in" className="cursor-pointer text-xs font-bold text-purple-400 hover:underline">
                                        Загрузить / Сменить фото товара
                                    </label>
                                </div>

                                {processedImage && (
                                    <div className="checkerboard p-4 rounded-2xl border border-slate-800 flex justify-center h-48">
                                        <img src={processedImage} alt="Cutout" className="max-h-full object-contain" />
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'studio' && (
                            <div className="space-y-6">
                                {/* Переключатель слайдов */}
                                <div className="flex items-center gap-3 justify-between bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                                    <div className="flex items-center gap-2">
                                        {generatedSeries.map((slide, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setActiveSlideIndex(idx)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeSlideIndex === idx ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                            >
                                                Слайд {idx + 1} ({slide.badge})
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => alert("Изображение сохранено!")} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-600/20">
                                        📥 Скачать HD Изображение
                                    </button>
                                </div>

                                {/* Карточка Aidentico Layer Compositor */}
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                    <div className="lg:col-span-5 flex justify-center">
                                        <div className="relative w-full max-w-[380px] aspect-[3/4] rounded-3xl overflow-hidden border border-purple-500/30 shadow-2xl shadow-purple-950/50 group bg-slate-900">
                                            
                                            {/* Слой 1: 3D Фон / Подиум */}
                                            <img src={activeSlide.bgUrl} alt="3D Pedestal" className="absolute inset-0 w-full h-full object-cover" />

                                            {/* Слой 2: Вырезанное Фото Товара (Посадка на подиум) */}
                                            {processedImage && (
                                                <div className="absolute inset-0 flex items-center justify-center p-8 z-10 pointer-events-none">
                                                    <img 
                                                        src={processedImage} 
                                                        alt="Product" 
                                                        className="max-h-[55%] max-w-[80%] object-contain filter drop-shadow-[0_20px_25px_rgba(0,0,0,0.85)]"
                                                    />
                                                </div>
                                            )}

                                            {/* Слой 3: Оверлей Aidentico Инфографики */}
                                            <div className="absolute inset-0 z-20 flex flex-col justify-between p-6 pointer-events-none">
                                                {/* Верхние плашки */}
                                                <div className="flex justify-between items-start">
                                                    <span className="bg-purple-600 text-white text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-lg shadow-purple-600/50">
                                                        {activeSlide.badge}
                                                    </span>
                                                    <span className="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 text-amber-400 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                                                        ★ 4.9 WB/Ozon
                                                    </span>
                                                </div>

                                                {/* Нижняя часть с текстом и буллетами */}
                                                <div className="bg-slate-950/85 backdrop-blur-md border border-slate-800/80 p-4 rounded-2xl space-y-2">
                                                    <div>
                                                        <h3 className="text-xl font-black text-white leading-tight uppercase tracking-wide">
                                                            {activeSlide.mainTitle}
                                                        </h3>
                                                        <p className="text-[10px] font-bold text-purple-400 uppercase tracking-widest">
                                                            {activeSlide.subTitle}
                                                        </p>
                                                    </div>

                                                    <div className="space-y-1 pt-1">
                                                        {activeSlide.bullets.map((b, i) => (
                                                            <div key={i} className="flex items-center gap-2 text-[10px] text-slate-300 font-medium">
                                                                <span className="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                                                                <span>{b}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                    {/* Информация о промпте и характеристиках */}
                                    <div className="lg:col-span-7 bg-slate-900/80 border border-slate-800 p-6 rounded-3xl space-y-4">
                                        <h3 className="text-base font-bold text-white">Параметры Слайда #{activeSlideIndex + 1}</h3>
                                        <div className="space-y-2 text-xs">
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                                <span className="text-purple-400 font-bold block mb-1">Заголовок:</span>
                                                <span className="text-slate-200">{activeSlide.mainTitle}</span>
                                            </div>
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                                <span className="text-purple-400 font-bold block mb-1">Преимущества (Буллеты):</span>
                                                <ul className="list-disc list-inside text-slate-300 space-y-1">
                                                    {activeSlide.bullets.map((b, i) => <li key={i}>{b}</li>)}
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        CardCraft AI Engine © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
