<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Presentation Studio — Pro Visual Edition</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        
        .slide-aspect {
            aspect-ratio: 16 / 9;
        }

        /* Затемнение фоновых изображений для читаемости текста */
        .slide-overlay {
            background: linear-gradient(90deg, rgba(3,7,18,0.95) 0%, rgba(3,7,18,0.85) 50%, rgba(3,7,18,0.6) 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [slides, setSlides] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            // Генератор объёмной презентации с фоновыми картинками и большим количеством текста
            const generatePresentation = () => {
                if (!prompt.trim()) return;
                setIsGenerating(true);

                setTimeout(() => {
                    const topic = prompt.trim();
                    const query = encodeURIComponent(topic);
                    
                    const newSlides = [
                        {
                            type: "title",
                            badge: "ГЛАВНАЯ ПРЕЗЕНТАЦИЯ 2026",
                            title: topic.toUpperCase(),
                            subtitle: "Стратегия развития, бизнес-модель и ключевые показатели проекта",
                            bgImage: `https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80`,
                            accentColor: "text-indigo-400",
                            description: "Данный проект представляет собой детально проработанную концепцию, охватывающую анализ целевой аудитории, продуктовое позиционирование и финансовые ориентиры на ближайшие годы.",
                            metrics: [
                                { label: "Целевой охват", value: "+150%" },
                                { label: "Конверсия", value: "8.4%" },
                                { label: "Окупаемость", value: "3 мес." }
                            ],
                            blocks: [
                                { head: "Цель концепции", text: "Создание масштабируемой экосистемы с высокой маржинальностью и быстрой адаптацией под запросы рынка." },
                                { head: "Фокус внимания", text: "Автоматизация ключевых процессов, внедрение инновационных решений и максимальная вовлеченность клиентов." }
                            ]
                        },
                        {
                            type: "analysis",
                            badge: "01 / ГЛУБОКИЙ АНАЛИЗ И ПРОБЛЕМАТИКА",
                            title: "АНАЛИЗ РЫНКА И ВЫЗОВЫ",
                            subtitle: "С какими фундаментальными трудностями сталкивается ниша сегодня",
                            bgImage: `https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1600&q=80`,
                            accentColor: "text-purple-400",
                            description: "Современный рынок требует молниеносного принятия решений. Традиционные подходы теряют эффективность из-за высокого уровня шума и перенасыщения предложениями.",
                            metrics: [
                                { label: "Потеря клиентов", value: "42%" },
                                { label: "Средний чек", value: "$1,200" },
                                { label: "Рост конкуренции", value: "x2.5" }
                            ],
                            blocks: [
                                { head: "Проблема 1: Высокий порог входа", text: "Клиенты сталкиваются со сложностью освоения новых продуктов, что снижает LTV и увеличивает отток на первых этапах." },
                                { head: "Проблема 2: Неэффективный маркетинг", text: "Большинство рекламных кампаний не доносят реальную ценность, сливая бюджеты на нецелевые контакты." },
                                { head: "Проблема 3: Скорость работы", text: "Задержка в реализации процессов на 2-3 дня приводит к потере до 30% потенциальной выручки." }
                            ]
                        },
                        {
                            type: "solution",
                            badge: "02 / ИННОВАЦИОННОЕ РЕШЕНИЕ",
                            title: "СТРАТЕГИЧЕСКИЙ ПЛАН И ПРОДУКТ",
                            subtitle: "Как наш подход полностью закрывает потребности аудитории",
                            bgImage: `https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80`,
                            accentColor: "text-emerald-400",
                            description: "Мы внедряем комплексное решение, объединяющее передовые технологии, адаптивный дизайн и персонализированную коммуникацию с каждым пользователем.",
                            metrics: [
                                { label: "Экономия времени", value: "75%" },
                                { label: "Удовлетворенность", value: "99/100" },
                                { label: "Автоматизация", value: "100%" }
                            ],
                            blocks: [
                                { head: "Модульная архитектура", text: "Каждый элемент системы легко подстраивается под задачи конкретного бизнеса без лишних затрат." },
                                { head: "Умная аналитика", text: "Встроенные алгоритмы отслеживают показатели в реальном времени и предлагают оптимизацию на лету." }
                            ]
                        },
                        {
                            type: "roadmap",
                            badge: "03 / ДОРОЖНАЯ КАРТА И ИТОГИ",
                            title: "ПЛАН РЕАЛИЗАЦИИ И МЕТРИКИ",
                            subtitle: "Пошаговый график вывода проекта на проектную мощность",
                            bgImage: `https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1600&q=80`,
                            accentColor: "text-amber-400",
                            description: "Поэтапное внедрение гарантирует минимальные риски и позволит выйти на самоокупаемость уже в рамках первого этапа развертывания.",
                            metrics: [
                                { label: "Этап 1 (Запуск)", value: "1-2 нед." },
                                { label: "Этап 2 (Рост)", value: "Месяц 2" },
                                { label: "Этап 3 (Масштаб)", value: "Квартал 2" }
                            ],
                            blocks: [
                                { head: "Фаза A: Подготовка и старт", text: "Настройка инфраструктуры, сбор первичной аналитики и запуск пилотной версии для первых пользователей." },
                                { head: "Фаза B: Активное масштабирование", text: "Подключение основных каналов привлечения, увеличение мощности сервиса и оптимизация конверсии." }
                            ]
                        }
                    ];

                    setSlides(newSlides);
                    setCurrentSlideIndex(0);
                    setIsGenerating(false);
                }, 1000);
            };

            const activeSlide = slides ? slides[currentSlideIndex] : null;

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    <div className="bg-glow w-[600px] h-[600px] bg-purple-600 -top-40 -left-40"></div>
                    <div className="bg-glow w-[500px] h-[500px] bg-indigo-600 -bottom-40 -right-40"></div>

                    {/* Шапка */}
                    <header className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    P
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">AI Presentation Studio</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">Pro Content Engine v2.0</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Панель ввода */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-6 space-y-8">
                        <div className="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4 backdrop-blur-md">
                            <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                                Введите тему (ИИ подберет стильные картинки фонов и заполнит слайды подробным контентом):
                            </label>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="text"
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && generatePresentation()}
                                    placeholder="Например: Фриланс биржа 2026, Маркетинговая стратегия, Стартап доставки..."
                                    className="flex-1 bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-2xl px-5 py-3 text-sm text-white placeholder-slate-500 outline-none transition-all"
                                />
                                <button 
                                    onClick={generatePresentation}
                                    disabled={isGenerating || !prompt.trim()}
                                    className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold px-8 py-3 rounded-2xl text-sm transition-all shadow-lg shadow-purple-600/30 whitespace-nowrap"
                                >
                                    {isGenerating ? "🪄 Составляем слайды..." : "🔥 Создать презентацию"}
                                </button>
                            </div>
                        </div>

                        {/* Холст слайдов */}
                        {activeSlide && (
                            <div className="space-y-6">
                                {/* Переключатель слайдов */}
                                <div className="flex items-center justify-between bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                                    <div className="flex items-center gap-2 overflow-x-auto">
                                        {slides.map((s, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setCurrentSlideIndex(idx)}
                                                className={`px-5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${currentSlideIndex === idx ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                            >
                                                Слайд {idx + 1}: {s.title.substring(0, 15)}...
                                            </button>
                                        ))}
                                    </div>
                                    <span className="text-xs font-bold text-purple-400 border border-purple-800/50 px-3 py-1.5 rounded-xl bg-purple-950/40">
                                        {currentSlideIndex + 1} из {slides.length}
                                    </span>
                                </div>

                                {/* Полноценный карточный слайд 16:9 с качественным фоном и плотным текстом */}
                                <div className="flex justify-center">
                                    <div 
                                        className="w-full max-w-[1000px] slide-aspect rounded-3xl overflow-hidden border border-slate-700 shadow-2xl relative bg-cover bg-center flex flex-col justify-between p-8 sm:p-12"
                                        style={{ backgroundImage: `url('${activeSlide.bgImage}')` }}
                                    >
                                        {/* Затемняющий слой для идеальной читаемости любого текста */}
                                        <div className="absolute inset-0 slide-overlay pointer-events-none"></div>

                                        {/* Верхняя плашка слайда */}
                                        <div className="relative z-10 flex justify-between items-center border-b border-white/10 pb-4">
                                            <span className="bg-purple-600/90 text-white text-[11px] font-black px-4 py-1.5 rounded-xl uppercase tracking-widest shadow-lg">
                                                {activeSlide.badge}
                                            </span>
                                            <span className="text-[11px] font-extrabold text-slate-300 uppercase tracking-widest bg-slate-950/60 px-3 py-1 rounded-lg border border-white/10">
                                                KEYNOTE PRESENTATION
                                            </span>
                                        </div>

                                        {/* Основное текстовое наполнение */}
                                        <div className="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center my-auto py-4">
                                            {/* Левая колонка: Заголовок и Описание */}
                                            <div className="lg:col-span-7 space-y-4">
                                                <h2 className="text-2xl sm:text-4xl font-black text-white leading-tight uppercase tracking-wide drop-shadow-md">
                                                    {activeSlide.title}
                                                </h2>
                                                <p className={`text-xs sm:text-sm font-extrabold ${activeSlide.accentColor} uppercase tracking-wider`}>
                                                    {activeSlide.subtitle}
                                                </p>
                                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal bg-slate-950/40 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                                    {activeSlide.description}
                                                </p>
                                            </div>

                                            {/* Правая колонка: Метрики и содержательные блоки */}
                                            <div className="lg:col-span-5 space-y-4">
                                                {/* Плашки с ключевыми цифрами */}
                                                <div className="grid grid-cols-3 gap-2">
                                                    {activeSlide.metrics.map((m, i) => (
                                                        <div key={i} className="bg-slate-950/80 backdrop-blur-md border border-white/10 p-2.5 rounded-xl text-center">
                                                            <div className="text-xs sm:text-base font-black text-white">{m.value}</div>
                                                            <div className="text-[9px] text-slate-400 font-bold uppercase">{m.label}</div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Инфо-блоки с развернутыми тезисами */}
                                                <div className="space-y-2">
                                                    {activeSlide.blocks.map((b, i) => (
                                                        <div key={i} className="bg-slate-950/80 backdrop-blur-md p-3 rounded-xl border border-white/10 space-y-1">
                                                            <div className="text-xs font-bold text-amber-400">{b.head}</div>
                                                            <div className="text-[11px] text-slate-300 leading-snug">{b.text}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Нижняя часть слайда */}
                                        <div className="relative z-10 flex justify-between items-center text-[10px] text-slate-400 font-bold border-t border-white/10 pt-3">
                                            <span>PRESENTATION STUDIO PRO</span>
                                            <span>СТРАНИЦА {currentSlideIndex + 1} ИЗ {slides.length}</span>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        AI Presentation Studio © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
