<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Presentation Maker — Автоматическая генерация презентаций</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        
        .slide-aspect {
            aspect-ratio: 16 / 9;
        }

        .slide-bg-gradient-1 {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        .slide-bg-gradient-2 {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #0f172a 100%);
        }
        .slide-bg-gradient-3 {
            background: linear-gradient(135deg, #1e1b4b 0%, #431407 50%, #090d16 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [slides, setSlides] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

            // Функция полной ИИ-генерации презентации по 1 промпту
            const generatePresentation = () => {
                if (!prompt.trim()) return;
                setIsGenerating(true);

                setTimeout(() => {
                    const topic = prompt.trim();
                    
                    // Автоматическая генерация 4 уникальных слайдов с разными фонами и контентом
                    const newSlides = [
                        {
                            type: "title",
                            badge: "ИИ ПРЕЗЕНТАЦИЯ",
                            title: topic.toUpperCase(),
                            subtitle: "Автоматически созданная стратегия и концепт проекта",
                            bgStyle: "slide-bg-gradient-1",
                            accentColor: "text-purple-400",
                            bullets: [
                                "Подготовлено ИИ-генератором Presentation Engine",
                                "Полный анализ и структура темы",
                                "Версия 2026"
                            ]
                        },
                        {
                            type: "problem",
                            badge: "01 / АНАЛИЗ И ПРОБЛЕМАТИКА",
                            title: "КЛЮЧЕВЫЕ ВЫЗОВЫ",
                            subtitle: "С какими задачами сталкивается рынок в рамках темы: " + topic,
                            bgStyle: "slide-bg-gradient-2",
                            accentColor: "text-emerald-400",
                            bullets: [
                                "Необходимость в быстрых и автоматизированных решениях",
                                "Высокие требования к дизайну и подаче материала",
                                "Оптимизация времени на подготовку коммерческих материалов"
                            ]
                        },
                        {
                            type: "solution",
                            badge: "02 / РЕШЕНИЕ И СТРАТЕГИЯ",
                            title: "ИННОВАЦИОННЫЙ ПОДХОД",
                            subtitle: "Пошаговый план реализации задачи",
                            bgStyle: "slide-bg-gradient-3",
                            accentColor: "text-amber-400",
                            bullets: [
                                "Автоматическая генерация контента на основе ИИ",
                                "Адаптивные стили и фоновые градиенты",
                                "Масштабируемая структура для любых задач"
                            ]
                        },
                        {
                            type: "conclusion",
                            badge: "03 / ИТОГИ И ЗАКЛЮЧЕНИЕ",
                            title: "ФИНАЛЬНЫЙ РЕЗУЛЬТАТ",
                            subtitle: "Перспективы и ожидаемый эффект",
                            bgStyle: "slide-bg-gradient-1",
                            accentColor: "text-cyan-400",
                            bullets: [
                                "Повышение скорости создания материалов на 90%",
                                "Готовый к демонстрации проект в 1 клик",
                                "Максимальная вовлеченность аудитории"
                            ]
                        }
                    ];

                    setSlides(newSlides);
                    setCurrentSlideIndex(0);
                    setIsGenerating(false);
                }, 1200);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    <div className="bg-glow w-[600px] h-[600px] bg-purple-600 -top-40 -left-40"></div>
                    <div className="bg-glow w-[500px] h-[500px] bg-indigo-600 -bottom-40 -right-40"></div>

                    {/* Шапка */}
                    <header className="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    P
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">AI Presenter</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">Auto Slide Engine v1.0</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Главный контент */}
                    <main className="flex-1 max-w-6xl mx-auto w-full p-6 space-y-8">
                        
                        {/* Форма ввода промпта */}
                        <div className="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl space-y-4 backdrop-blur-md">
                            <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                                Введите тему или описание для презентации:
                            </label>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="text"
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && generatePresentation()}
                                    placeholder="Например: Запуск нового эко-кроссовка, Стратегия продвижения бренда, Презентация стартапа..."
                                    className="flex-1 bg-slate-950 border border-slate-700 focus:border-purple-500 rounded-2xl px-5 py-3 text-sm text-white placeholder-slate-500 outline-none transition-all"
                                />
                                <button 
                                    onClick={generatePresentation}
                                    disabled={isGenerating || !prompt.trim()}
                                    className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold px-8 py-3 rounded-2xl text-sm transition-all shadow-lg shadow-purple-600/30 whitespace-nowrap"
                                >
                                    {isGenerating ? "🪄 ИИ создает слайды..." : "✨ Сгенерировать всё"}
                                </button>
                            </div>
                        </div>

                        {/* Интерактивный просмотр презентации */}
                        {slides && (
                            <div className="space-y-6">
                                {/* Панель управления слайдами */}
                                <div className="flex items-center justify-between bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                                    <div className="flex items-center gap-2 overflow-x-auto">
                                        {slides.map((s, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setCurrentSlideIndex(idx)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${currentSlideIndex === idx ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                            >
                                                Слайд {idx + 1}
                                            </button>
                                        ))}
                                    </div>
                                    <span className="text-xs font-bold text-slate-400">
                                        {currentSlideIndex + 1} / {slides.length}
                                    </span>
                                </div>

                                {/* Холст Слайда (16:9) */}
                                <div className="flex justify-center">
                                    <div className={`w-full max-w-[900px] slide-aspect rounded-3xl overflow-hidden border border-slate-700/60 shadow-2xl ${slides[currentSlideIndex].bgStyle} p-10 flex flex-col justify-between relative`}>
                                        
                                        {/* Декоративное неоновое свечение слайда */}
                                        <div className="absolute top-0 right-0 w-80 h-80 bg-white/5 blur-3xl rounded-full pointer-events-none"></div>

                                        {/* Шапка слайда */}
                                        <div className="flex justify-between items-start relative z-10">
                                            <span className="bg-slate-950/70 backdrop-blur-md border border-slate-700/60 text-white text-[11px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-lg">
                                                {slides[currentSlideIndex].badge}
                                            </span>
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                                AI PRESENTATION MAKER
                                            </span>
                                        </div>

                                        {/* Основное содержимое слайда */}
                                        <div className="space-y-4 my-auto relative z-10 max-w-2xl">
                                            <h2 className="text-3xl sm:text-4xl font-black text-white leading-tight uppercase tracking-wide">
                                                {slides[currentSlideIndex].title}
                                            </h2>
                                            <p className={`text-sm font-extrabold ${slides[currentSlideIndex].accentColor} uppercase tracking-wider`}>
                                                {slides[currentSlideIndex].subtitle}
                                            </p>

                                            <div className="space-y-2 pt-4">
                                                {slides[currentSlideIndex].bullets.map((bullet, i) => (
                                                    <div key={i} className="flex items-start gap-3 text-xs sm:text-sm text-slate-200 font-medium bg-slate-950/40 backdrop-blur-sm p-3 rounded-xl border border-white/5">
                                                        <span className="w-2 h-2 rounded-full bg-purple-400 mt-1.5 shrink-0"></span>
                                                        <span>{bullet}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Футер слайда */}
                                        <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold border-t border-white/10 pt-4 relative z-10">
                                            <span>CARDCRAFT ENGINE © 2026</span>
                                            <span>CONFIDENTIAL</span>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        AI Presentation Generator Engine © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
