<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardCraft AI — Aidentico 3D Infographics Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#0f172a'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- html2canvas for High Resolution Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
    }

    .font-heading {
      font-family: 'Montserrat', sans-serif;
    }

    .glow-purple {
      box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.35);
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.8);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white custom-scrollbar overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Helper 1: Intelligent Prompt Translator & Multi-Dictionary Cleaner ---
    const PRODUCT_DICTIONARY = {
      'вентилятор': 'modern electric desk fan',
      'винтелятор': 'modern electric desk fan',
      'вентильятор': 'modern electric desk fan',
      'кофемашина': 'automatic espresso coffee machine',
      'кофеварка': 'drip coffee maker',
      'часы': 'sleek smartwatch with metallic strap',
      'смарт часы': 'sleek smartwatch',
      'наушники': 'wireless noise cancelling headphones',
      'блендер': 'high speed kitchen blender',
      'чайник': 'electric glass kettle with LED glow',
      'увлажнитель': 'minimalist ultrasonic air humidifier',
      'утюг': 'steam iron',
      'фен': 'ionic hair dryer',
      'пылесос': 'robotic vacuum cleaner',
      'термос': 'stainless steel thermal flask water bottle'
    };

    function translateAndEnhancePrompt(rawInput, styleTheme, angle) {
      const cleanedInput = rawInput.toLowerCase().trim();
      
      // Auto dictionary lookup or intelligent fallback
      let englishProduct = PRODUCT_DICTIONARY[cleanedInput];
      if (!englishProduct) {
        // If not in dictionary, strip typo characters and present cleanly
        englishProduct = rawInput.replace(/[^a-zA-Zа-яА-Я0-9\s]/g, '').trim();
      }

      // Define 3D Pedestal Aesthetic based on Theme
      let pedestalDesc = "on a glossy dark purple neon glowing 3d studio pedestal platform, cyberpunk volumetric lighting";
      if (styleTheme === 'cyber_ice') {
        pedestalDesc = "on a frosted cyan and ice-blue glass 3d geometric pedestal, cool studio lights";
      } else if (styleTheme === 'gold_marble') {
        pedestalDesc = "on a luxury white marble and gold trimmed 3d podium, soft warm commercial studio lighting";
      } else if (styleTheme === 'dark_minimal') {
        pedestalDesc = "on a matte black carbon fiber 3d pedestal, sleek rim lighting, dark studio setup";
      }

      // Construct professional Octane/Midjourney style prompt
      return `Commercial 3D product render of a ${englishProduct}, ${angle}, placed ${pedestalDesc}, octane render, photorealistic, 8k resolution, centered composition, high-end e-commerce product photography, no text, no watermark`;
    }

    // --- Helper 2: Client-side Image Background Removal Engine ---
    function removeImageBackground(imageSrc, threshold = 230) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          // Simple color/luminance thresholding mask algorithm
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            
            // Check if pixel is close to white background or near-white gray
            if (r > threshold && g > threshold && b > threshold) {
              data[i + 3] = 0; // Set Alpha to transparent
            } else if (r > threshold - 20 && g > threshold - 20 && b > threshold - 20) {
              // Smooth alpha transition edge
              const avg = (r + g + b) / 3;
              data[i + 3] = Math.max(0, 255 - (avg - (threshold - 20)) * 10);
            }
          }

          ctx.putImageData(imgData, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(imageSrc); // Fallback to raw if error
        img.src = imageSrc;
      });
    }

    function App() {
      // --- Persistent State Hooks (f5 safe) ---
      const [credits, setCredits] = useState(() => {
        const saved = localStorage.getItem('cc_credits');
        return saved !== null ? parseInt(saved, 10) : 15;
      });

      const [activeTab, setActiveTab] = useState(() => {
        return localStorage.getItem('cc_tab') || 'generator';
      });

      const [productTitle, setProductTitle] = useState(() => {
        return localStorage.getItem('cc_title') || 'Винтелятор настольный';
      });

      const [styleTheme, setStyleTheme] = useState(() => {
        return localStorage.getItem('cc_style') || 'neon_purple';
      });

      const [slideCount, setSlideCount] = useState(() => {
        return parseInt(localStorage.getItem('cc_count') || '3', 10);
      });

      const [uploadedImage, setUploadedImage] = useState(() => {
        return localStorage.getItem('cc_image') || null;
      });

      const [processedImage, setProcessedImage] = useState(() => {
        return localStorage.getItem('cc_processed_image') || null;
      });

      const [apiKey, setApiKey] = useState(() => {
        return localStorage.getItem('cc_api_key') || '';
      });

      const [generatedSeries, setGeneratedSeries] = useState(() => {
        const saved = localStorage.getItem('cc_series');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return null;
      });

      const [activeSlideIndex, setActiveSlideIndex] = useState(0);

      // --- Interactive Layer View Controls ---
      const [show3dBackground, setShow3dBackground] = useState(true);
      const [showProductLayer, setShowProductLayer] = useState(true);
      const [showOverlays, setShowOverlays] = useState(true);
      const [isBgProcessing, setIsBgProcessing] = useState(false);

      // --- Studio Processing Status State ---
      const [isGenerating, setIsGenerating] = useState(false);
      const [generationStep, setGenerationStep] = useState('');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      const cardExportRef = useRef(null);

      // Update localStorage whenever state changes
      useEffect(() => { localStorage.setItem('cc_credits', credits); }, [credits]);
      useEffect(() => { localStorage.setItem('cc_tab', activeTab); }, [activeTab]);
      useEffect(() => { localStorage.setItem('cc_title', productTitle); }, [productTitle]);
      useEffect(() => { localStorage.setItem('cc_style', styleTheme); }, [styleTheme]);
      useEffect(() => { localStorage.setItem('cc_count', slideCount); }, [slideCount]);
      useEffect(() => { localStorage.setItem('cc_api_key', apiKey); }, [apiKey]);

      useEffect(() => {
        if (uploadedImage) localStorage.setItem('cc_image', uploadedImage);
        else localStorage.removeItem('cc_image');
      }, [uploadedImage]);

      useEffect(() => {
        if (processedImage) localStorage.setItem('cc_processed_image', processedImage);
        else localStorage.removeItem('cc_processed_image');
      }, [processedImage]);

      useEffect(() => {
        if (generatedSeries) localStorage.setItem('cc_series', JSON.stringify(generatedSeries));
        else localStorage.removeItem('cc_series');
      }, [generatedSeries]);

      // Refresh Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, generatedSeries, activeSlideIndex, isGenerating, show3dBackground, showProductLayer, showOverlays]);

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsBgProcessing(true);
          const reader = new FileReader();
          reader.onloadend = async () => {
            const rawB64 = reader.result;
            setUploadedImage(rawB64);
            
            // Auto cutout transparent product mask
            const cutout = await removeImageBackground(rawB64);
            setProcessedImage(cutout);
            setIsBgProcessing(false);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleClearImage = () => {
        setUploadedImage(null);
        setProcessedImage(null);
      };

      const trigger3DMixerGeneration = async (e) => {
        e.preventDefault();

        if (!productTitle.trim()) {
          alert('Пожалуйста, укажите название товара!');
          return;
        }

        if (credits < slideCount) {
          alert(`Недостаточно кредитов. Требуется: ${slideCount}, у вас: ${credits}`);
          return;
        }

        setIsGenerating(true);
        setGenerationStep('ИИ-Переводчик: Очищаем запрос и формируем 3D-промпты...');

        await new Promise(r => setTimeout(r, 600));

        try {
          const slideConfigs = [
            { 
              badge: "ХИТ ПРОДАЖ 2026", 
              defaultTitle: productTitle.toUpperCase(), 
              defaultSub: "ФЛАГМАНСКАЯ СЕРИЯ ДЛЯ МАРКЕТПЛЕЙСОВ", 
              angle: "front view hero shot on centered podium",
              accent: "#6366f1",
              bullets: ["Усиленная конструкция 300W", "Эргономичный сенсорный корпус", "Гарантия качества 24 месяца"]
            },
            { 
              badge: "ХАРАКТЕРИСТИКИ", 
              defaultTitle: "МАКСИМАЛЬНЫЙ КОМФОРТ", 
              defaultSub: "ПЕРЕДОВЫЕ ТЕХНОЛОГИИ В КАЖДОЙ ДЕТАЛИ", 
              angle: "close up macro angle shot",
              accent: "#10b981",
              bullets: ["Бесшумный ночной режим 22дБ", "Интеллектуальный климат-контроль", "Низкое энергопотребление A+++"]
            },
            { 
              badge: "КОМПЛЕКТАЦИЯ", 
              defaultTitle: "ВСЁ В ОДНОЙ КОРОБКЕ", 
              defaultSub: "ПОЛНЫЙ НАБОР ГОТОВ К ИСПОЛЬЗОВАНИЮ", 
              angle: "isometric perspective 3d view",
              accent: "#f59e0b",
              bullets: ["Пульт ДУ + Батарейки", "Фирменный кабель питания", "Подарочная упаковка в комплекте"]
            },
            { 
              badge: "АКЦИЯ -25%", 
              defaultTitle: "СПЕЦИАЛЬНАЯ ЦЕНА", 
              defaultSub: "ОГРАНИЧЕННАЯ ПАРТИЯ СО СКИДКОЙ", 
              angle: "cinematic dynamic side view",
              accent: "#ec4899",
              bullets: ["Быстрая доставка за 24 часа", "Оплата при получении", "Проверка перед покупкой"]
            },
            { 
              badge: "СЕРТИФИКАТ", 
              defaultTitle: "100% ОРИГИНАЛ", 
              defaultSub: "ОФИЦИАЛЬНАЯ ГАРАНТИЯ И ПОДДЕРЖКА", 
              angle: "top angled beauty shot with volumetric lights",
              accent: "#8b5cf6",
              bullets: ["Сертифицировано в ЕАЭС", "Сервисные центры по всей стране", "Возврат без вопросов 14 дней"]
            }
          ];

          const newSeries = [];

          for (let i = 0; i < slideCount; i++) {
            setGenerationStep(`Генерируем 3D-подиум для Слайда ${i + 1} из ${slideCount}...`);
            const config = slideConfigs[i % slideConfigs.length];

            // 1. Generate Intelligent English Prompt
            const prompt3D = translateAndEnhancePrompt(productTitle, styleTheme, config.angle);
            
            // 2. Synthesize seed-based 3D scene URL
            const seed = Math.floor(Math.random() * 888888) + 100000;
            const encodedPrompt = encodeURIComponent(prompt3D);
            const scene3DUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1000&height=1250&seed=${seed}&nologo=true`;

            newSeries.push({
              id: Date.now() + i,
              badge: config.badge,
              mainTitle: config.defaultTitle,
              subTitle: config.defaultSub,
              accentColor: config.accent,
              bullets: [...config.bullets],
              prompt3D: prompt3D,
              background3dUrl: scene3DUrl
            });

            await new Promise(r => setTimeout(r, 400));
          }

          setGeneratedSeries(newSeries);
          setCredits(prev => Math.max(0, prev - slideCount));
          setActiveSlideIndex(0);
          setIsGenerating(false);
          setActiveTab('studio'); // Auto move to workspace

        } catch (err) {
          console.error("3D Studio Error:", err);
          alert("Произошла ошибка при сборке. Попробуйте снова!");
          setIsGenerating(false);
        }
      };

      const handleExportPNG = () => {
        if (!cardExportRef.current) return;
        
        html2canvas(cardExportRef.current, {
          scale: 3,
          useCORS: true,
          backgroundColor: null,
          logging: false
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = `Aidentico_3D_${productTitle.replace(/\s+/g, '_')}_slide_${activeSlideIndex + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between relative bg-[#030712] text-slate-100 selection:bg-indigo-600">
          
          {/* Top Bar Navigation */}
          <header className="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl px-4 sm:px-8 py-3.5">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                  <i data-lucide="box" className="w-6 h-6 text-white"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-heading font-black text-xl tracking-wide bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
                      CardCraft AI
                    </span>
                    <span className="text-[10px] font-black px-2 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full tracking-wider uppercase">
                      Aidentico 3D
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">Генератор 3D-Инфографики для Маркетплейсов</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-1 sm:gap-3 bg-slate-900/90 border border-slate-800 p-1 rounded-2xl">
                <button
                  onClick={() => setActiveTab('generator')}
                  className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                    activeTab === 'generator' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide="wand-2" className="w-4 h-4"></i>
                  <span>Миксер</span>
                </button>

                <button
                  onClick={() => setActiveTab('studio')}
                  className={`flex items-center gap-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                    activeTab === 'studio' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i data-lucide="layers" className="w-4 h-4"></i>
                  <span>3D Студия</span>
                  {generatedSeries && (
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  )}
                </button>
              </div>

              {/* Credits & Settings */}
              <div className="flex items-center gap-3">
                <div className="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl flex items-center gap-2">
                  <i data-lucide="zap" className="w-4 h-4 text-emerald-400 fill-emerald-400/20"></i>
                  <span className="text-sm font-black text-emerald-400">{credits}</span>
                  <span className="text-xs text-slate-500 hidden md:inline">кредитов</span>
                </div>

                <button
                  onClick={() => setShowApiKeyModal(true)}
                  className="p-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500/50 text-slate-400 hover:text-white transition"
                  title="Настройки API / Про-Ключ"
                >
                  <i data-lucide="settings" className="w-5 h-5"></i>
                </button>
              </div>

            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8">
            
            {/* ================= TAB 1: GENERATOR / MIXER ================= */}
            {activeTab === 'generator' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                {/* Left Form Controls (7 Cols) */}
                <div className="lg:col-span-7 space-y-6">
                  
                  <div className="glass-panel p-6 sm:p-8 rounded-3xl space-y-6 shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="flex justify-between items-center border-b border-slate-800/80 pb-4">
                      <div>
                        <h2 className="text-xl font-black font-heading text-white flex items-center gap-2">
                          <i data-lucide="sparkles" className="w-5 h-5 text-indigo-400"></i>
                          Параметры 3D-Генерации
                        </h2>
                        <p className="text-xs text-slate-400 mt-1">Автоматический перевод, удаление фона и сборка Aidentico</p>
                      </div>
                      <span className="text-xs font-bold px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                        3D Engine v3.1
                      </span>
                    </div>

                    <form onSubmit={trigger3DMixerGeneration} className="space-y-6">
                      
                      {/* Product Name Input */}
                      <div>
                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                          Название товара (поддерживает опечатки)
                        </label>
                        <div className="relative">
                          <input
                            type="text"
                            required
                            value={productTitle}
                            onChange={(e) => setProductTitle(e.target.value)}
                            placeholder="например: винтелятор настольный, кофемашина..."
                            className="w-full px-4 py-3.5 rounded-2xl glass-input text-white placeholder-slate-500 focus:outline-none text-sm transition"
                          />
                          <div className="absolute right-3 top-3.5 text-xs text-slate-500 bg-slate-900/90 px-2.5 py-1 rounded-lg border border-slate-800">
                            Auto AI Clean
                          </div>
                        </div>
                      </div>

                      {/* Photo Upload & Cutout Preview */}
                      <div>
                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                          Фото товара (Автоматическое вырезание фона)
                        </label>
                        
                        <div className="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 rounded-2xl p-5 transition bg-slate-950/40 relative group cursor-pointer">
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleImageUpload}
                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                          />

                          {isBgProcessing ? (
                            <div className="py-6 text-center space-y-2">
                              <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                              <p className="text-xs font-bold text-indigo-400">Удаляем фон с фото товара...</p>
                            </div>
                          ) : uploadedImage ? (
                            <div className="flex items-center justify-between gap-4">
                              <div className="flex items-center gap-4">
                                <div className="relative w-16 h-16 rounded-xl overflow-hidden bg-slate-900 border border-slate-700 p-1">
                                  <img src={processedImage || uploadedImage} alt="Cutout" className="w-full h-full object-contain" />
                                </div>
                                <div>
                                  <p className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                                    <i data-lucide="check-circle" className="w-3.5 h-3.5"></i> Фото готово
                                  </p>
                                  <p className="text-[11px] text-slate-400 mt-0.5">Фон вырезан и готов для 3D-подиума</p>
                                </div>
                              </div>
                              <button
                                type="button"
                                onClick={(e) => { e.stopPropagation(); handleClearImage(); }}
                                className="z-20 text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/20 transition"
                              >
                                Удалить
                              </button>
                            </div>
                          ) : (
                            <div className="text-center py-4">
                              <i data-lucide="upload-cloud" className="w-8 h-8 text-slate-500 group-hover:text-indigo-400 mx-auto mb-2 transition"></i>
                              <p className="text-xs font-bold text-slate-200">Загрузить фото товара (PNG / JPG)</p>
                              <p className="text-[11px] text-slate-500 mt-1">Рекомендуется на светлом или контрастном фоне</p>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Style Theme Selection */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                            Стиль 3D-Подиума
                          </label>
                          <select
                            value={styleTheme}
                            onChange={(e) => setStyleTheme(e.target.value)}
                            className="w-full px-4 py-3 rounded-2xl glass-input text-slate-200 text-sm focus:outline-none"
                          >
                            <option value="neon_purple">Neon Cyberpunk (Фиолетовый неоновый)</option>
                            <option value="cyber_ice">Cyber Ice (Голубой ледяной глянцевый)</option>
                            <option value="gold_marble">Luxury Gold Marble (Белый мрамор и золото)</option>
                            <option value="dark_minimal">Dark Carbon Minimal (Матовый черный)</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                            Количество слайдов серии
                          </label>
                          <div className="grid grid-cols-3 gap-2">
                            {[1, 3, 5].map((cnt) => (
                              <button
                                key={cnt}
                                type="button"
                                onClick={() => setSlideCount(cnt)}
                                className={`py-2.5 rounded-xl text-xs font-bold border transition ${
                                  slideCount === cnt
                                    ? 'bg-indigo-600 border-indigo-500 text-white shadow-md shadow-indigo-600/30'
                                    : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'
                                }`}
                              >
                                {cnt} {cnt === 1 ? 'слайд' : 'слайда'}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Big Submit Button */}
                      <button
                        type="submit"
                        disabled={isGenerating}
                        className="w-full py-4 rounded-2xl font-bold font-heading text-sm sm:text-base text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-emerald-500 hover:from-indigo-500 hover:to-emerald-400 transition shadow-xl shadow-indigo-600/30 flex items-center justify-center gap-3 disabled:opacity-50"
                      >
                        {isGenerating ? (
                          <>
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            <span>{generationStep}</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="wand-2" className="w-5 h-5"></i>
                            <span>Сгенерировать 3D-Инфографику ({slideCount} {slideCount === 1 ? 'кредит' : 'кредита'})</span>
                          </>
                        )}
                      </button>

                    </form>

                  </div>

                </div>

                {/* Right Info Showcase (5 Cols) */}
                <div className="lg:col-span-5 space-y-6">
                  
                  {/* Concept Card */}
                  <div className="glass-panel p-6 rounded-3xl space-y-4 border border-indigo-500/20 relative overflow-hidden">
                    <h3 className="font-heading font-extrabold text-base text-indigo-300 flex items-center gap-2">
                      <i data-lucide="layers" className="w-5 h-5 text-indigo-400"></i>
                      Как работают 3 Пути Миксера?
                    </h3>

                    <div className="space-y-3 text-xs text-slate-300">
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="font-bold text-indigo-400 block mb-0.5">1. Умный ИИ-Переводчик</span>
                        Автоматически очищает опечатки («винтелятор» → «modern electric desk fan») и создает идеальный Octane 3D-промпт.
                      </div>

                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="font-bold text-emerald-400 block mb-0.5">2. Слои & Удаление фона</span>
                        Вырезает продукт с вашего снимка и сажает его напрямую на сгенерированный 3D-подиум.
                      </div>

                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="font-bold text-amber-400 block mb-0.5">3. Воронка Aidentico</span>
                        Собирает серию конверсионных слайдов: Главная, Характеристики, Комплект, Скидка и Гарантия.
                      </div>
                    </div>
                  </div>

                  {/* Live Render Example Mockup */}
                  <div className="glass-panel p-4 rounded-3xl text-center space-y-3">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Предосмотр 3D-Сцены</span>
                    
                    <div className="aspect-[4/5] max-w-[280px] mx-auto rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 relative flex flex-col justify-between p-4 shadow-2xl">
                      <div className="absolute inset-0 bg-gradient-to-b from-purple-900/40 via-slate-950 to-slate-950"></div>

                      <div className="relative z-10 flex justify-between items-start">
                        <span className="bg-indigo-600 text-white font-black text-[10px] px-2.5 py-1 rounded-lg uppercase shadow">
                          ХИТ ПРОДАЖ
                        </span>
                        <span className="bg-slate-900/80 backdrop-blur text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded-lg border border-slate-700">
                          ★ 4.9 WB
                        </span>
                      </div>

                      <div className="relative z-10 my-auto text-center">
                        {processedImage || uploadedImage ? (
                          <img src={processedImage || uploadedImage} className="w-32 h-32 object-contain mx-auto drop-shadow-2xl" />
                        ) : (
                          <div className="w-28 h-28 mx-auto rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center">
                            <i data-lucide="box" className="w-12 h-12 text-indigo-400"></i>
                          </div>
                        )}
                      </div>

                      <div className="relative z-10 space-y-1 text-left">
                        <div className="bg-slate-900/90 backdrop-blur border border-slate-800 px-2.5 py-1 rounded-lg text-[10px] text-slate-200 font-semibold">
                          ✓ Мощный обдув 300W
                        </div>
                        <div className="bg-slate-900/90 backdrop-blur border border-slate-800 px-2.5 py-1 rounded-lg text-[10px] text-slate-200 font-semibold">
                          ✓ Бесшумный ночной режим
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* ================= TAB 2: 3D STUDIO WORKSPACE ================= */}
            {activeTab === 'studio' && (
              <div className="space-y-6">
                
                {!generatedSeries ? (
                  <div className="glass-panel p-12 text-center rounded-3xl max-w-xl mx-auto space-y-4">
                    <i data-lucide="layers" className="w-12 h-12 text-slate-600 mx-auto"></i>
                    <h3 className="text-lg font-extrabold font-heading text-slate-300">Нет сгенерированной 3D-серии</h3>
                    <p className="text-xs text-slate-400 max-w-sm mx-auto">
                      Перейдите на вкладку «Миксер», чтобы задать параметры товара и запустить 3D-генерацию.
                    </p>
                    <button
                      onClick={() => setActiveTab('generator')}
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-indigo-600/30"
                    >
                      Перейти в Миксер
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    
                    {/* Left Interactive Canvas Viewer (7 Cols) */}
                    <div className="lg:col-span-7 space-y-4">
                      
                      {/* Top Canvas Controls Bar */}
                      <div className="flex flex-wrap justify-between items-center gap-2 bg-slate-900/90 border border-slate-800 p-2 rounded-2xl">
                        
                        {/* Slide Switcher Tabs */}
                        <div className="flex items-center gap-1 overflow-x-auto">
                          {generatedSeries.map((slide, idx) => (
                            <button
                              key={slide.id}
                              onClick={() => setActiveSlideIndex(idx)}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                                activeSlideIndex === idx
                                  ? 'bg-indigo-600 text-white shadow'
                                  : 'text-slate-400 hover:text-white'
                              }`}
                            >
                              Слайд {idx + 1}
                            </button>
                          ))}
                        </div>

                        {/* Layer Controls Toggles */}
                        <div className="flex items-center gap-1 border-l border-slate-800 pl-2">
                          <button
                            onClick={() => setShow3dBackground(!show3dBackground)}
                            className={`p-1.5 rounded-lg text-xs font-semibold transition ${show3dBackground ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-600'}`}
                            title="Слой 3D-Фона"
                          >
                            <i data-lucide="image" className="w-4 h-4"></i>
                          </button>
                          <button
                            onClick={() => setShowProductLayer(!showProductLayer)}
                            className={`p-1.5 rounded-lg text-xs font-semibold transition ${showProductLayer ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-600'}`}
                            title="Слой Товара"
                          >
                            <i data-lucide="box" className="w-4 h-4"></i>
                          </button>
                          <button
                            onClick={() => setShowOverlays(!showOverlays)}
                            className={`p-1.5 rounded-lg text-xs font-semibold transition ${showOverlays ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-600'}`}
                            title="Слой Текста & Инфографики"
                          >
                            <i data-lucide="type" className="w-4 h-4"></i>
                          </button>
                        </div>

                      </div>

                      {/* Main Canvas Export Box */}
                      <div
                        ref={cardExportRef}
                        className="aspect-[4/5] max-w-[480px] mx-auto rounded-3xl overflow-hidden border border-slate-700 bg-slate-950 relative flex flex-col justify-between p-6 shadow-2xl transition-all"
                      >
                        {/* Layer 1: 3D Render Background */}
                        {show3dBackground && (
                          <div className="absolute inset-0 z-0">
                            <img
                              src={generatedSeries[activeSlideIndex]?.background3dUrl}
                              alt="3D Podium"
                              className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-slate-950/60"></div>
                          </div>
                        )}

                        {/* Layer 2: Real Cutout Product Layer */}
                        {showProductLayer && (processedImage || uploadedImage) && (
                          <div className="absolute inset-0 z-10 flex items-center justify-center p-8 pointer-events-none">
                            <img
                              src={processedImage || uploadedImage}
                              alt="Product Layer"
                              className="max-w-[70%] max-h-[55%] object-contain drop-shadow-[0_20px_35px_rgba(0,0,0,0.85)]"
                            />
                          </div>
                        )}

                        {/* Layer 3: Text & Infographic Overlays */}
                        {showOverlays && (
                          <>
                            {/* Header Badge */}
                            <div className="relative z-20 flex justify-between items-start gap-2">
                              <div>
                                <span
                                  className="inline-block font-heading font-black text-xs uppercase px-3 py-1.5 rounded-xl tracking-wider text-white shadow-lg mb-1"
                                  style={{ backgroundColor: generatedSeries[activeSlideIndex]?.accentColor || '#6366f1' }}
                                >
                                  {generatedSeries[activeSlideIndex]?.badge}
                                </span>
                                <h3 className="font-heading font-black text-lg text-white leading-tight drop-shadow-md">
                                  {generatedSeries[activeSlideIndex]?.mainTitle}
                                </h3>
                                <p className="text-[11px] font-semibold text-slate-300 drop-shadow">
                                  {generatedSeries[activeSlideIndex]?.subTitle}
                                </p>
                              </div>

                              <div className="bg-slate-900/90 backdrop-blur border border-slate-700/80 px-2.5 py-1 rounded-xl text-[11px] font-black text-amber-400 flex items-center gap-1 shadow-lg">
                                ★ 4.9 <span className="text-slate-400 font-bold">(WB)</span>
                              </div>
                            </div>

                            {/* Bottom Bullet Badges */}
                            <div className="relative z-20 space-y-2 mt-auto pt-4">
                              {generatedSeries[activeSlideIndex]?.bullets.map((bullet, bIdx) => (
                                <div
                                  key={bIdx}
                                  className="bg-slate-950/85 backdrop-blur-md border border-slate-800 p-2.5 rounded-2xl flex items-center gap-3 shadow-xl"
                                >
                                  <div
                                    className="w-5 h-5 rounded-lg flex items-center justify-center text-xs font-bold text-white shrink-0"
                                    style={{ backgroundColor: generatedSeries[activeSlideIndex]?.accentColor || '#6366f1' }}
                                  >
                                    ✓
                                  </div>
                                  <span className="text-xs font-bold text-slate-100">{bullet}</span>
                                </div>
                              ))}
                            </div>
                          </>
                        )}

                        {/* Footer Watermark */}
                        <div className="relative z-20 pt-2 flex justify-between items-center text-[10px] text-slate-400 font-bold border-t border-slate-800/60 mt-2">
                          <span>AIDENTICO 3D MIXER</span>
                          <span className="uppercase text-indigo-400 tracking-widest">READY FOR MARKETPLACE</span>
                        </div>

                      </div>

                      {/* Export Action */}
                      <div className="flex justify-center pt-2">
                        <button
                          onClick={handleExportPNG}
                          className="bg-gradient-to-r from-emerald-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white font-heading font-black text-sm px-6 py-3 rounded-2xl transition shadow-xl shadow-emerald-600/20 flex items-center gap-2"
                        >
                          <i data-lucide="download" className="w-4 h-4"></i>
                          <span>Скачать Слайд (PNG 4K)</span>
                        </button>
                      </div>

                    </div>

                    {/* Right Editor Controls Panel (5 Cols) */}
                    <div className="lg:col-span-5 space-y-6">
                      
                      {/* Slide Text Editor */}
                      <div className="glass-panel p-6 rounded-3xl space-y-4">
                        <h3 className="font-heading font-extrabold text-sm text-slate-200 flex items-center gap-2">
                          <i data-lucide="edit-3" className="w-4 h-4 text-indigo-400"></i>
                          Редактор Слайда {activeSlideIndex + 1}
                        </h3>

                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Бейдж (Верхний штамп)</label>
                          <input
                            type="text"
                            value={generatedSeries[activeSlideIndex]?.badge || ''}
                            onChange={(e) => {
                              const updated = [...generatedSeries];
                              updated[activeSlideIndex].badge = e.target.value;
                              setGeneratedSeries(updated);
                            }}
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Главный заголовок</label>
                          <input
                            type="text"
                            value={generatedSeries[activeSlideIndex]?.mainTitle || ''}
                            onChange={(e) => {
                              const updated = [...generatedSeries];
                              updated[activeSlideIndex].mainTitle = e.target.value;
                              setGeneratedSeries(updated);
                            }}
                            className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none"
                          />
                        </div>

                        {/* Bullet Items Editor */}
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-2">Преимущества (Бейджи)</label>
                          <div className="space-y-2">
                            {generatedSeries[activeSlideIndex]?.bullets.map((bText, bIdx) => (
                              <div key={bIdx} className="flex gap-2">
                                <input
                                  type="text"
                                  value={bText}
                                  onChange={(e) => {
                                    const updated = [...generatedSeries];
                                    updated[activeSlideIndex].bullets[bIdx] = e.target.value;
                                    setGeneratedSeries(updated);
                                  }}
                                  className="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200"
                                />
                                <button
                                  type="button"
                                  onClick={() => {
                                    const updated = [...generatedSeries];
                                    updated[activeSlideIndex].bullets.splice(bIdx, 1);
                                    setGeneratedSeries(updated);
                                  }}
                                  className="text-slate-500 hover:text-rose-400 px-2"
                                >
                                  ×
                                </button>
                              </div>
                            ))}
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              const updated = [...generatedSeries];
                              updated[activeSlideIndex].bullets.push("Новая характеристика");
                              setGeneratedSeries(updated);
                            }}
                            className="mt-2 text-xs font-bold text-indigo-400 hover:underline"
                          >
                            + Добавить пункт
                          </button>
                        </div>
                      </div>

                      {/* Prompt Inspector Box */}
                      <div className="glass-panel p-5 rounded-3xl space-y-2">
                        <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest block">
                          3D Prompt Inspector (ИИ-Запрос)
                        </span>
                        <p className="text-xs text-slate-400 leading-relaxed font-mono bg-slate-950 p-3 rounded-xl border border-slate-800/80 select-all">
                          {generatedSeries[activeSlideIndex]?.prompt3D}
                        </p>
                      </div>

                    </div>

                  </div>
                )}

              </div>
            )}

          </main>

          {showApiKeyModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 border border-slate-800">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-heading font-extrabold text-base text-white">Настройки ИИ-Движка</h3>
                  <button onClick={() => setShowApiKeyModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <p className="text-xs text-slate-400 leading-relaxed">
                  По умолчанию используется встроенный гибридный 3D-генератор. Вы также можете указать собственный API-ключ для внешних нейросетей (Fal.ai / Replicate).
                </p>

                <div>
                  <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    API Key (Опционально)
                  </label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="sk_live_..."
                    className="w-full px-4 py-2.5 rounded-xl glass-input text-xs text-white focus:outline-none"
                  />
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setShowApiKeyModal(false)}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition"
                  >
                    Сохранить и закрыть
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/60 py-4 px-6 text-center text-xs text-slate-500">
            CardCraft AI Studio © 2026 — Aidentico 3D Infographic Engine
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
