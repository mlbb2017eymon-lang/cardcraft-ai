<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft AI — 3D Инфографика (Aidentico Style)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel, Supabase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f9fafb;
        }

        .title-font {
            font-family: 'Montserrat', sans-serif;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.35;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased custom-scrollbar">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://zecwwgefsbpiadifnnuc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [user, setUser] = useState(null);
            const [credits, setCredits] = useState(15);
            const [activeTab, setActiveTab] = useState('home');

            // Поля ввода
            const [productTitle, setProductTitle] = useState('Кофемашина');
            const [category, setCategory] = useState('electronics');
            const [slideCount, setSlideCount] = useState(3);
            const [styleTheme, setStyleTheme] = useState('neon_purple');

            const [isGenerating, setIsGenerating] = useState(false);
            const [activeSlideIndex, setActiveSlideIndex] = useState(0);

            // Сгенерированные карточки
            const [generatedSeries, setGeneratedSeries] = useState([]);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) setUser(session.user);
                });
            }, []);

            // Функция автоперевода ключевых слов для точного 3D-рендеринга
            const cleanProductQuery = (text) => {
                let query = text.trim();
                if (!query || query.includes('[') || query.includes(']')) {
                    query = "coffee machine";
                }
                return query;
            };

            const handleGenerate = async () => {
                const cleanQuery = cleanProductQuery(productTitle);

                if (credits < slideCount) {
                    alert(`Недостаточно кредитов. Требуется: ${slideCount}`);
                    setActiveTab('pricing');
                    return;
                }

                setIsGenerating(true);

                try {
                    // Стиль 3D Подиума в формате Aidentico
                    let backgroundStyle = "dark purple neon 3d podium, futuristic studio background, vibrant accent lights";
                    if (styleTheme === 'cyber_ice') backgroundStyle = "cyan and ice blue glowing 3d pedestal, cyberpunk studio lighting";
                    if (styleTheme === 'gold_marble') backgroundStyle = "luxury gold and white marble 3d platform, premium studio setup";
                    if (styleTheme === 'dark_studio') backgroundStyle = "minimalist dark studio background, sleek black 3d podium, soft spotlight";

                    const newSeries = [];

                    // Варианты слайдов воронки Aidentico
                    const slideConfigs = [
                        {
                            badge: "ТОП ПРОДАЖ",
                            mainTitle: productTitle.toUpperCase(),
                            subTitle: "ПРЕМИАЛЬНОЕ КАЧЕСТВО 2026",
                            angle: "front view hero shot on 3d podium",
                            bullets: ["Усиленный корпус", "Гарантия 2 года", "Быстрая доставка"]
                        },
                        {
                            badge: "ХАРАКТЕРИСТИКИ",
                            mainTitle: "ВЫСОКАЯ МОЩНОСТЬ",
                            subTitle: "УМНОЕ УПРАВЛЕНИЕ В 1 КЛИК",
                            angle: "close-up macro view of details on 3d pedestal",
                            bullets: ["Энергосбережение A++", "Бесшумная работа", "Сенсорный экран"]
                        },
                        {
                            badge: "КОМПЛЕКТАЦИЯ",
                            mainTitle: "ВСЁ В КОМПЛЕКТЕ",
                            subTitle: "ГОТОВО К ИСПОЛЬЗОВАНИЮ",
                            angle: "top isometric 3d view with accessory layout",
                            bullets: ["Подарочная упаковка", "Полный набор", "Инструкция на русском"]
                        },
                        {
                            badge: "БЕЗОПАСНОСТЬ",
                            mainTitle: "ЭКО МАТЕРИАЛЫ",
                            subTitle: "СЕРТИФИЦИРОВАННЫЙ ТОВАР",
                            angle: "side angle view on glowing 3d stage",
                            bullets: ["Защита от перегрева", "BPA Free пластик", "Надежные фиксаторы"]
                        },
                        {
                            badge: "СКИДКА -25%",
                            mainTitle: "УСПЕЙ КУПИТЬ",
                            subTitle: "ОГРАНИЧЕННАЯ СЕРИЯ",
                            angle: "cinematic 3d product shot on pedestal with soft smoke",
                            bullets: ["Лучшая цена года", "Эксклюзивный цвет", "Гарантия возврата"]
                        }
                    ];

                    for (let i = 0; i < slideCount; i++) {
                        const seed = Math.floor(Math.random() * 888888) + 100000;
                        const config = slideConfigs[i % slideConfigs.length];
                        
                        // Формирование точного промпта без дублирования
                        const imagePrompt = `Commercial 3d render of ${cleanQuery}, ${config.angle}, placed on a ${backgroundStyle}, studio product photography, clean composition, octane render, 8k resolution, marketplace banner style`;
                        
                        const encodedPrompt = encodeURIComponent(imagePrompt);
                        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=900&height=1200&seed=${seed}&nologo=true`;

                        newSeries.push({
                            badge: config.badge,
                            mainTitle: config.mainTitle,
                            subTitle: config.subTitle,
                            bullets: config.bullets,
                            imagePrompt: imagePrompt,
                            imageUrl: imageUrl
                        });
                    }

                    setGeneratedSeries(newSeries);
                    setCredits(prev => prev - slideCount);
                    setActiveSlideIndex(0);
                    setActiveTab('studio');

                } catch (err) {
                    console.error("Error generating:", err);
                    alert("Произошла ошибка при генерации. Попробуйте еще раз!");
                } finally {
                    setIsGenerating(false);
                }
            };

            const downloadImage = (url) => {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.download = `aidentico-card-slide-${activeSlideIndex + 1}.jpg`;
                link.click();
            };

            const currentCard = generatedSeries[activeSlideIndex];

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-x-hidden">
                    <div className="bg-glow w-[650px] h-[650px] bg-purple-600 -top-40 -left-40"></div>
                    <div className="bg-glow w-[550px] h-[550px] bg-indigo-600 bottom-0 right-0"></div>

                    {/* Навигация */}
                    <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 via-indigo-500 to-cyan-400 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-purple-500/30">
                                    C
                                </div>
                                <div>
                                    <span className="text-xl font-black bg-gradient-to-r from-white via-slate-200 to-purple-300 bg-clip-text text-transparent block leading-none">
                                        CardCraft AI
                                    </span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase tracking-wider">Aidentico Style Generator</span>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-8 text-sm font-bold">
                                <button onClick={() => setActiveTab('home')} className={`transition-all ${activeTab === 'home' ? 'text-purple-400' : 'text-slate-400 hover:text-white'}`}>Генератор</button>
                                <button onClick={() => setActiveTab('studio')} className={`transition-all ${activeTab === 'studio' ? 'text-purple-400' : 'text-slate-400 hover:text-white'}`}>3D Студия</button>
                            </nav>

                            <div className="flex items-center gap-4">
                                <div className="bg-purple-950/80 border border-purple-800/60 px-4 py-1.5 rounded-xl text-xs font-bold text-purple-300 flex items-center gap-1.5 shadow-lg">
                                    <span>⚡ {credits} Кредитов</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 relative z-10">
                        {/* Форма создания */}
                        {activeTab === 'home' && (
                            <section className="pt-12 pb-20 px-6 max-w-4xl mx-auto">
                                <div className="text-center mb-10">
                                    <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-950/80 border border-purple-800/50 text-purple-300 text-xs font-bold mb-6">
                                        <span>✨ ИИ-Генератор Карточек в Стиле Aidentico</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-6xl font-black text-white leading-tight tracking-tight mb-4 title-font">
                                        3D ИНФОГРАФИКА ДЛЯ МАРКЕТПЛЕЙСОВ
                                    </h1>
                                    <p className="text-slate-400 text-base max-w-2xl mx-auto">
                                        Введите название товара (например: Кофемашина, Блендер, Нальные часы) — ИИ сам нарисует 3D-подиум и соберет инфографику.
                                    </p>
                                </div>

                                <div className="bg-slate-900/90 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl backdrop-blur-xl space-y-6">
                                    <div className="space-y-3">
                                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                                            Название или описание товара
                                        </label>
                                        <input 
                                            type="text" 
                                            value={productTitle}
                                            onChange={(e) => setProductTitle(e.target.value)}
                                            placeholder="например: Кофемашина / Coffee machine..."
                                            className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-5 py-4 text-sm text-white placeholder-slate-500 focus:border-purple-500 focus:outline-none"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div className="space-y-2">
                                            <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">Категория</label>
                                            <select 
                                                value={category}
                                                onChange={(e) => setCategory(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-xs font-bold text-white focus:border-purple-500 focus:outline-none"
                                            >
                                                <option value="electronics">Бытовая техника & Электроника</option>
                                                <option value="accessories">Часы & Аксессуары</option>
                                                <option value="home">Товары для дома</option>
                                            </select>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">Кол-во слайдов</label>
                                            <div className="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                                                {[1, 3, 5].map(num => (
                                                    <button 
                                                        key={num} 
                                                        onClick={() => setSlideCount(num)}
                                                        className={`py-2 rounded-xl text-xs font-bold transition-all ${slideCount === num ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                                    >
                                                        {num}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">3D Стиль сцены</label>
                                            <select 
                                                value={styleTheme} 
                                                onChange={(e) => setStyleTheme(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-xs font-bold text-white focus:border-purple-500 focus:outline-none"
                                            >
                                                <option value="neon_purple">💜 Неоновый Подиум (3D)</option>
                                                <option value="cyber_ice">🩵 Кибер Лед & Свет</option>
                                                <option value="gold_marble">🏆 Премиум Золото & Мрамор</option>
                                                <option value="dark_studio">🖤 Тёмный Студийный Минимализм</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleGenerate} 
                                        disabled={isGenerating}
                                        className="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white font-extrabold py-5 rounded-2xl text-sm transition-all shadow-xl shadow-purple-600/30 flex items-center justify-center gap-3 disabled:opacity-50"
                                    >
                                        <span>{isGenerating ? "Создание 3D карточки в стиле Aidentico..." : `Сгенерировать ${slideCount} 3D-карточки (${slideCount} кр.)`}</span>
                                        <span className="text-lg">⚡</span>
                                    </button>
                                </div>
                            </section>
                        )}

                        {/* Результат воронки Aidentico с полноценной инфографикой */}
                        {activeTab === 'studio' && (
                            <section className="py-8 px-6 max-w-6xl mx-auto">
                                {generatedSeries.length === 0 ? (
                                    <div className="text-center py-20">
                                        <p className="text-slate-400">Создайте первую карточку на Главной странице!</p>
                                        <button onClick={() => setActiveTab('home')} className="mt-4 bg-purple-600 text-white px-6 py-2.5 rounded-xl font-bold text-xs">
                                            Перейти на главную
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <div>
                                                <h2 className="text-2xl font-black text-white title-font">Сгенерированная 3D Серия</h2>
                                                <p className="text-xs text-slate-400">Готовая инфографика воронки Aidentico</p>
                                            </div>
                                            <button 
                                                onClick={() => downloadImage(currentCard.imageUrl)}
                                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/20"
                                            >
                                                <span>Скачать HD Изображение</span>
                                                <span>📥</span>
                                            </button>
                                        </div>

                                        {/* Переключение слайдов */}
                                        <div className="flex gap-3 mb-6 overflow-x-auto pb-2 custom-scrollbar">
                                            {generatedSeries.map((card, idx) => (
                                                <button 
                                                    key={idx}
                                                    onClick={() => setActiveSlideIndex(idx)}
                                                    className={`px-5 py-3 rounded-2xl text-xs font-bold transition-all border ${activeSlideIndex === idx ? 'bg-purple-600 border-purple-400 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                                                >
                                                    Слайд {idx + 1} ({card.badge})
                                                </button>
                                            ))}
                                        </div>

                                        {/* Карточка товара с наложением инфографики (как в Aidentico) */}
                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                                            <div className="lg:col-span-7 flex justify-center">
                                                <div className="relative w-full max-w-[400px] rounded-[32px] overflow-hidden shadow-2xl border border-purple-500/30 bg-slate-900 aspect-[3/4]">
                                                    {/* Изображение 3D рендера */}
                                                    <img 
                                                        src={currentCard.imageUrl} 
                                                        alt="3D Infographic Render" 
                                                        className="w-full h-full object-cover absolute inset-0"
                                                    />

                                                    {/* Оверлей Aidentico: Плашки и Текст Инфографики */}
                                                    <div className="absolute inset-0 p-5 flex flex-col justify-between bg-gradient-to-t from-slate-950/80 via-transparent to-slate-950/40 pointer-events-none">
                                                        
                                                        {/* Верхний Бейдж */}
                                                        <div className="flex justify-between items-start">
                                                            <span className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider shadow-lg">
                                                                {currentCard.badge}
                                                            </span>
                                                        </div>

                                                        {/* Заголовок и преимущества */}
                                                        <div className="space-y-3">
                                                            <div>
                                                                <h2 className="text-2xl font-black text-white title-font leading-tight drop-shadow-md">
                                                                    {currentCard.mainTitle}
                                                                </h2>
                                                                <p className="text-[11px] font-bold text-cyan-400 uppercase tracking-widest drop-shadow">
                                                                    {currentCard.subTitle}
                                                                </p>
                                                            </div>

                                                            {/* Буллеты преимуществ */}
                                                            <div className="space-y-1.5 pt-2">
                                                                {currentCard.bullets.map((b, i) => (
                                                                    <div key={i} className="bg-slate-900/90 backdrop-blur-md border border-slate-700/60 px-3 py-1.5 rounded-xl flex items-center gap-2 text-[11px] text-white font-semibold">
                                                                        <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                                                                        <span>{b}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>

                                                    </div>
                                                </div>
                                            </div>

                                            {/* Правая панель информации */}
                                            <div className="lg:col-span-5 bg-slate-900/80 p-6 rounded-3xl border border-slate-800 space-y-4">
                                                <h3 className="text-lg font-bold text-white">Параметры Слайда #{activeSlideIndex + 1}</h3>
                                                
                                                <div className="space-y-1.5">
                                                    <span className="text-[10px] font-extrabold text-purple-400 uppercase tracking-wider">Тематический заголовок:</span>
                                                    <p className="text-sm font-black text-white">{currentCard.mainTitle}</p>
                                                </div>

                                                <div>
                                                    <span className="text-[10px] font-extrabold text-slate-400 uppercase block mb-1">ИИ-Промпт 3D сцены:</span>
                                                    <p className="text-[11px] text-slate-300 bg-slate-950 p-3.5 rounded-xl border border-slate-800 font-mono leading-relaxed">
                                                        {currentCard.imagePrompt}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </section>
                        )}
                    </main>

                    <footer className="border-t border-slate-900 py-6 px-6 text-center text-xs text-slate-500">
                        CardCraft AI Engine © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
