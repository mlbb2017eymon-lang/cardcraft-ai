<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft AI — Part 2: Background Remover Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        .checkerboard {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://zecwwgefsbpiadifnnuc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [credits, setCredits] = useState(() => {
                const saved = localStorage.getItem('cc_credits');
                return saved !== null ? parseInt(saved, 10) : 15;
            });
            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('cc_tab') || 'mixer');
            
            // Состояние вырезанного фото товара
            const [processedImage, setProcessedImage] = useState(() => localStorage.getItem('cc_processed_img') || null);
            const [isProcessingImg, setIsProcessingImg] = useState(false);

            useEffect(() => {
                localStorage.setItem('cc_credits', credits.toString());
                localStorage.setItem('cc_tab', activeTab);
                if (processedImage) localStorage.setItem('cc_processed_img', processedImage);
                else localStorage.removeItem('cc_processed_img');
            }, [credits, activeTab, processedImage]);

            // Автоматическая очистка светлого/однотонного фона через Canvas
            const removeBackgroundCanvas = (imageSrc) => {
                setIsProcessingImg(true);
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = imageSrc;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    // Удаление белого/светлого фона (Chroma Key)
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        if (r > 225 && g > 225 && b > 225) {
                            data[i + 3] = 0; // Сделать пиксель прозрачным
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    setProcessedImage(canvas.toDataURL('image/png'));
                    setIsProcessingImg(false);
                };
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        removeBackgroundCanvas(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const clearImage = () => {
                setProcessedImage(null);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    <div className="bg-glow w-[600px] h-[600px] bg-purple-600 -top-40 -left-40"></div>

                    {/* Навигация */}
                    <header className="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('mixer')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    C
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">CardCraft AI</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">Background AI v4.0</span>
                                </div>
                            </div>

                            <nav className="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                                <button 
                                    onClick={() => setActiveTab('mixer')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'mixer' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🪄 ИИ-Миксер
                                </button>
                                <button 
                                    onClick={() => setActiveTab('studio')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'studio' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🖼️ 3D Студия
                                </button>
                            </nav>

                            <div className="flex items-center gap-3">
                                <div className="bg-purple-950/80 border border-purple-800/60 px-4 py-2 rounded-xl text-xs font-bold text-purple-300">
                                    ⚡ {credits} Кредитов
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Рабочая область */}
                    <main className="flex-1 max-w-4xl mx-auto w-full p-6">
                        {activeTab === 'mixer' && (
                            <div className="bg-slate-900/90 border border-slate-800 p-8 rounded-3xl space-y-6">
                                <div className="border-b border-slate-800 pb-4">
                                    <h2 className="text-xl font-black text-white">Модуль 2: Загрузка и вырезание фона товара</h2>
                                    <p className="text-xs text-slate-400 mt-1">Загрузите фото продукта — сайт автоматически удалит лишний белый фон и подготовит объект для посадки на 3D-подиум.</p>
                                </div>

                                <div className="space-y-3">
                                    <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider">
                                        Выберите фото товара с вашего устройства:
                                    </label>

                                    <div className="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-2xl p-6 text-center bg-slate-950/50 transition-all">
                                        <input 
                                            type="file" 
                                            accept="image/*"
                                            onChange={handleFileUpload}
                                            className="hidden" 
                                            id="product-file-input"
                                        />
                                        <label htmlFor="product-file-input" className="cursor-pointer flex flex-col items-center gap-2">
                                            <div className="w-12 h-12 rounded-2xl bg-purple-900/50 border border-purple-600/50 flex items-center justify-center text-xl">
                                                📷
                                            </div>
                                            <span className="text-xs font-bold text-purple-300">Нажмите для выбора файла</span>
                                            <span className="text-[10px] text-slate-500">Поддерживаются PNG, JPG, WEBP</span>
                                        </label>
                                    </div>
                                </div>

                                {isProcessingImg && (
                                    <div className="p-4 bg-purple-950/40 border border-purple-800/60 rounded-2xl text-center text-xs text-purple-300 animate-pulse">
                                        ⚡ Удаление фона и обработка пикселей товара...
                                    </div>
                                )}

                                {processedImage && (
                                    <div className="space-y-3 pt-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                                                <span>✓</span> Товар обработан (Прозрачный PNG)
                                            </span>
                                            <button onClick={clearImage} className="text-xs font-bold text-red-400 hover:underline">
                                                Удалить фото
                                            </button>
                                        </div>

                                        <div className="checkerboard p-6 rounded-2xl border border-slate-800 flex justify-center items-center h-64 overflow-hidden">
                                            <img 
                                                src={processedImage} 
                                                alt="Processed Product" 
                                                className="max-h-full object-contain drop-shadow-2xl"
                                            />
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'studio' && (
                            <div className="bg-slate-900/80 border border-slate-800 p-8 rounded-3xl text-center">
                                <h2 className="text-2xl font-bold text-white mb-2">3D Студия</h2>
                                <p className="text-slate-400 text-sm">Здесь будут показываться готовые карточки.</p>
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        CardCraft AI Engine © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
