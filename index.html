    <title>CardCraft AI — E-commerce Studio & Infographics Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
        }

        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white custom-scrollbar">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Конфигурация Supabase и Gemini API
        const SUPABASE_URL = "https://zecwwgefsbpiadifnnuc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg";
        const GEMINI_API_KEY = "AQ.Ab8RN6LOLliooqSKnkHARTnLS1wDlCtsqFU_8LJBDJs1H7oNuQ";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Словарь локализации
        const I18N = {
            ru: {
                brand: "CardCraft AI",
                nav_home: "Главная",
                nav_features: "Возможности",
                nav_pricing: "Тарифы",
                nav_studio: "Студия Canvas",
                nav_login: "Войти",
                nav_signup: "Регистрация",
                nav_logout: "Выйти",
                hero_title: "CardCraft AI — ИИ-дизайн карточек для маркетплейсов",
                hero_subtitle: "Генерируйте сочную инфографику, удаляйте фон и выделяйте плюсы товаров за секунды для Wildberries, Ozon и Uzum.",
                btn_generate: "Сгенерировать карточку",
                prompt_placeholder: "Опишите товар (например: Соковыжималка мощная, черная, кухонная премиум)...",
                credits_left: "Осталось кредитов:",
                tab_home: "Обзор",
                tab_editor: "Редактор холста",
                tab_pricing: "Тарифы",
                btn_download: "Скачать PNG",
                pwd_gen_btn: "✨ Сгенерировать надежный пароль",
                pwd_weak: "Слабый пароль",
                pwd_medium: "Средний пароль",
                pwd_strong: "Надежный пароль ✨",
                auth_modal_title: "Авторизация в CardCraft AI",
                auth_google: "Войти через Google"
            },
            uz: {
                brand: "CardCraft AI",
                nav_home: "Bosh sahifa",
                nav_features: "Imkoniyatlar",
                nav_pricing: "Tariflar",
                nav_studio: "Canvas Studiya",
                nav_login: "Kirish",
                nav_signup: "Ro'yxatdan o'tish",
                nav_logout: "Chiqish",
                hero_title: "CardCraft AI — marketpleyslar uchun sun'iy intellekt",
                hero_subtitle: "Wildberries, Ozon va Uzum uchun mahsulot kartochkalarini sekundlarda yarating va фонни olib tashlang.",
                btn_generate: "Kartochka yaratish",
                prompt_placeholder: "Mahsulotni tasvirlang (masalan: Oshxona uchun sharbat chiqargich)...",
                credits_left: "Qolgan kreditlar:",
                tab_home: "Sharh",
                tab_editor: "Muharrir",
                tab_pricing: "Tariflar",
                btn_download: "PNG yuklab olish",
                pwd_gen_btn: "✨ Kuchli parol yaratish",
                pwd_weak: "Kuchsiz parol",
                pwd_medium: "O'rtacha parol",
                pwd_strong: "Kuchli parol ✨",
                auth_modal_title: "CardCraft AI ga kirish",
                auth_google: "Google orqali kirish"
            },
            en: {
                brand: "CardCraft AI",
                nav_home: "Home",
                nav_features: "Features",
                nav_pricing: "Pricing",
                nav_studio: "Canvas Studio",
                nav_login: "Sign In",
                nav_signup: "Sign Up",
                nav_logout: "Sign Out",
                hero_title: "CardCraft AI — AI Studio for E-commerce Sellers",
                hero_subtitle: "Generate selling product cards, remove backgrounds, and create infographics in seconds.",
                btn_generate: "Generate Card",
                prompt_placeholder: "Describe product details (e.g., Premium black blender with titanium blades)...",
                credits_left: "Credits left:",
                tab_home: "Overview",
                tab_editor: "Canvas Editor",
                tab_pricing: "Pricing",
                btn_download: "Download PNG",
                pwd_gen_btn: "✨ Generate Strong Password",
                pwd_weak: "Weak password",
                pwd_medium: "Medium password",
                pwd_strong: "Strong password ✨",
                auth_modal_title: "Sign in to CardCraft AI",
                auth_google: "Sign in with Google"
            }
        };

        function App() {
            const [lang, setLang] = useState('ru');
            const [user, setUser] = useState(null);
            const [credits, setCredits] = useState(3);
            const [activeTab, setActiveTab] = useState('home');
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [isSignUp, setIsSignUp] = useState(false);

            const [prompt, setPrompt] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedCard, setGeneratedCard] = useState({
                title: "ПРЕМИУМ ТОВАР",
                subtitle: "Максимальное качество и надежность",
                features: ["Мощность 1500 Вт", "Гарантия 2 года", "Эко-материалы"],
                bgGradient: "from-indigo-900 to-slate-900",
                badgeColor: "bg-indigo-600"
            });

            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [passwordScore, setPasswordScore] = useState(0);

            const canvasRef = useRef(null);
            const t = I18N[lang];

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        setUser(session.user);
                    } else {
                        setUser(null);
                        setActiveTab('home');
                    }
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        setUser(session.user);
                    } else {
                        setUser(null);
                        setActiveTab('home');
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            const handlePasswordChange = (val) => {
                setAuthPassword(val);
                let score = 0;
                if (val.length >= 8) score += 25;
                if (val.length >= 12) score += 25;
                if (/[0-9]/.test(val)) score += 25;
                if (/[^a-zA-Z0-9]/.test(val)) score += 25;
                setPasswordScore(score);
            };

            const generatePassword = () => {
                const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
                let pass = "";
                for (let i = 0; i < 16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
                handlePasswordChange(pass);
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (isSignUp) {
                        const { data, error } = await supabase.auth.signUp({ email: authEmail, password: authPassword });
                        if (error) throw error;
                        setUser(data.user);
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
                        if (error) throw error;
                        setUser(data.user);
                    }
                    setIsAuthModalOpen(false);
                    setActiveTab('studio');
                } catch (err) {
                    setAuthError(err.message);
                }
            };

            const handleGoogleAuth = async () => {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
                if (error) alert(error.message);
            };

            const handleSignOut = async () => {
                await supabase.auth.signOut();
                setUser(null);
                setActiveTab('home');
            };

            const handleGenerate = async () => {
                if (!user) {
                    setIsAuthModalOpen(true);
                    return;
                }
                if (credits <= 0) {
                    alert("У вас закончились бесплатные генерации! Пополните баланс на вкладке Тарифы.");
                    setActiveTab('pricing');
                    return;
                }
                if (!prompt.trim()) {
                    alert("Пожалуйста, введите описание товара!");
                    return;
                }

                setIsGenerating(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Ты опытный маркетолог маркетплейсов (Ozon, Wildberries). Сгенерируй структуру карточки товара для описания: "${prompt}". Ответ дай strictly JSON в формате: {"title": "Главный заголовок", "subtitle": "Короткий подзаголовок", "features": ["Плюс 1", "Плюс 2", "Плюс 3"]}`
                                }]
                            }]
                        })
                    });

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (text) {
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            setGeneratedCard({
                                title: parsed.title || "ПРЕМИУМ ТОВАР",
                                subtitle: parsed.subtitle || "Высокое качество",
                                features: parsed.features || ["Отличный выбор", "Быстрая доставка", "Гарантия"],
                                bgGradient: "from-slate-900 via-indigo-950 to-slate-900",
                                badgeColor: "bg-indigo-600"
                            });
                        }
                    }

                    setCredits(prev => prev - 1);
                    setActiveTab('studio');
                } catch (e) {
                    console.error("Ошибка Gemini:", e);
                    setGeneratedCard({
                        title: prompt.toUpperCase().slice(0, 20),
                        subtitle: "ТОП Продаж 2026",
                        features: ["Высокая прочность", "Гарантия 12 месяцев", "Быстрая отправка"],
                        bgGradient: "from-indigo-900 to-slate-900",
                        badgeColor: "bg-indigo-600"
                    });
                    setCredits(prev => prev - 1);
                    setActiveTab('studio');
                } finally {
                    setIsGenerating(false);
                }
            };

            const downloadCanvas = () => {
                alert("Идёт подготовка PNG высокой четкости для Ozon/WB...");
            };

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-x-hidden">
                    <div className="bg-glow-orb w-[500px] h-[500px] bg-indigo-600 -top-20 -left-20"></div>
                    <div className="bg-glow-orb w-[400px] h-[400px] bg-cyan-600 bottom-0 right-0"></div>

                    <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800/80 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-indigo-500/20">
                                    C
                                </div>
                                <span className="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                                    {t.brand}
                                </span>
                            </div>

                            <nav className="hidden md:flex items-center gap-6 text-sm font-medium">
                                <button onClick={() => setActiveTab('home')} className={`transition-colors ${activeTab === 'home' ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-white'}`}>{t.nav_home}</button>
                                {user && (
                                    <button onClick={() => setActiveTab('studio')} className={`transition-colors ${activeTab === 'studio' ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-white'}`}>{t.nav_studio}</button>
                                )}
                                <button onClick={() => setActiveTab('pricing')} className={`transition-colors ${activeTab === 'pricing' ? 'text-indigo-400 font-semibold' : 'text-slate-400 hover:text-white'}`}>{t.nav_pricing}</button>
                            </nav>

                            <div className="flex items-center gap-4">
                                <div className="bg-slate-900 p-1 rounded-xl border border-slate-800 flex text-xs font-semibold">
                                    {['ru', 'uz', 'en'].map(l => (
                                        <button key={l} onClick={() => setLang(l)} className={`px-2.5 py-1 rounded-lg uppercase transition-all ${lang === l ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                            {l}
                                        </button>
                                    ))}
                                </div>

                                {user ? (
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800/50 px-3 py-1.5 rounded-xl font-medium">
                                            ⚡ {credits} {t.credits_left}
                                        </span>
                                        <button onClick={handleSignOut} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl transition-all">
                                            {t.nav_logout}
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={() => { setIsSignUp(false); setIsAuthModalOpen(true); }} className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-semibold transition-all shadow-lg shadow-indigo-600/30">
                                        {t.nav_login}
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 relative z-10">
                        {activeTab === 'home' && (
                            <section className="pt-24 pb-16 px-6 max-w-5xl mx-auto text-center">
                                <h1 className="text-4xl md:text-6xl font-extrabold text-white leading-tight mb-6">
                                    {t.hero_title}
                                </h1>
                                <p className="text-lg text-slate-400 mb-10 max-w-2xl mx-auto">
                                    {t.hero_subtitle}
                                </p>

                                <div className="max-w-2xl mx-auto bg-slate-900/90 border border-slate-800 p-3 rounded-2xl shadow-2xl flex items-center gap-3">
                                    <label className="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center cursor-pointer text-slate-300 hover:text-white transition-all shrink-0">
                                        +
                                        <input type="file" accept="image/*" className="hidden" onChange={(e) => setSelectedImage(e.target.files[0])} />
                                    </label>

                                    <input 
                                        type="text" 
                                        value={prompt}
                                        onChange={(e) => setPrompt(e.target.value)}
                                        placeholder={t.prompt_placeholder}
                                        className="flex-1 bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none px-2"
                                    />

                                    <button 
                                        onClick={handleGenerate} 
                                        disabled={isGenerating}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3.5 rounded-xl font-semibold text-xs transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-2 whitespace-nowrap disabled:opacity-50"
                                    >
                                        <span>{isGenerating ? "Генерируем..." : t.btn_generate}</span>
                                        <span>✨</span>
                                    </button>
                                </div>
                                {selectedImage && (
                                    <p className="text-xs text-emerald-400 mt-2">📷 Загружено фото: {selectedImage.name}</p>
                                )}
                            </section>
                        )}

                        {activeTab === 'studio' && (
                            <section className="py-12 px-6 max-w-6xl mx-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-2xl font-bold text-white">Студия Слайдов</h2>
                                    <button onClick={downloadCanvas} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg">
                                        {t.btn_download}
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div ref={canvasRef} className={`aspect-[3/4] rounded-3xl p-8 bg-gradient-to-b ${generatedCard.bgGradient} border border-slate-800 flex flex-col justify-between shadow-2xl relative overflow-hidden`}>
                                        <div className="space-y-3">
                                            <span className={`inline-block text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full text-white ${generatedCard.badgeColor}`}>
                                                {generatedCard.subtitle}
                                            </span>
                                            <h3 className="text-3xl font-extrabold text-white leading-tight">
                                                {generatedCard.title}
                                            </h3>
                                        </div>

                                        <div className="my-auto h-48 bg-slate-800/50 rounded-2xl border border-white/10 flex items-center justify-center text-slate-400 text-xs">
                                            {selectedImage ? `[ Изображение: ${selectedImage.name} ]` : "[ 3D-Рендер / Фото товара без фона ]"}
                                        </div>

                                        <div className="space-y-2">
                                            {generatedCard.features.map((feat, idx) => (
                                                <div key={idx} className="bg-slate-900/80 backdrop-blur-md p-3 rounded-xl border border-white/10 text-xs font-medium text-slate-200 flex items-center gap-2">
                                                    <span className="text-emerald-400 font-bold">✓</span> {feat}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/60 p-6 rounded-3xl border border-slate-800 space-y-6">
                                        <h4 className="text-lg font-bold text-white">Настройка элементов карточки</h4>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Заголовок</label>
                                            <input type="text" value={generatedCard.title} onChange={(e) => setGeneratedCard({...generatedCard, title: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Подзаголовок / Плашка</label>
                                            <input type="text" value={generatedCard.subtitle} onChange={(e) => setGeneratedCard({...generatedCard, subtitle: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-2">Цветовой стиль</label>
                                            <div className="flex gap-3">
                                                <button onClick={() => setGeneratedCard({...generatedCard, bgGradient: "from-indigo-900 to-slate-900", badgeColor: "bg-indigo-600"})} className="w-8 h-8 rounded-full bg-indigo-600 border-2 border-white/20"></button>
                                                <button onClick={() => setGeneratedCard({...generatedCard, bgGradient: "from-emerald-950 to-slate-900", badgeColor: "bg-emerald-600"})} className="w-8 h-8 rounded-full bg-emerald-600 border-2 border-white/20"></button>
                                                <button onClick={() => setGeneratedCard({...generatedCard, bgGradient: "from-rose-950 to-slate-900", badgeColor: "bg-rose-600"})} className="w-8 h-8 rounded-full bg-rose-600 border-2 border-white/20"></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {activeTab === 'pricing' && (
                            <section className="py-16 px-6 max-w-5xl mx-auto">
                                <h2 className="text-3xl font-extrabold text-center text-white mb-12">{t.nav_pricing}</h2>
                                <div className="grid md:grid-cols-2 gap-8">
                                    <div className="bg-slate-900 p-8 rounded-3xl border border-slate-800 space-y-6">
                                        <h3 className="text-xl font-bold text-white">Старт</h3>
                                        <div className="text-3xl font-black text-white">Бесплатно</div>
                                        <p className="text-sm text-slate-400">3 генерации карточек при регистрации.</p>
                                    </div>
                                    <div className="bg-gradient-to-b from-indigo-950 to-slate-900 p-8 rounded-3xl border border-indigo-500/30 space-y-6">
                                        <h3 className="text-xl font-bold text-white">PRO Продавец</h3>
                                        <div className="text-3xl font-black text-white">99,000 UZS / мес</div>
                                        <p className="text-sm text-slate-300">Неограниченная AI-генерация инфографики и 3D-фонов.</p>
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>

                    {isAuthModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full relative shadow-2xl">
                                <button onClick={() => setIsAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                                <h3 className="text-2xl font-bold text-white mb-2">{isSignUp ? "Создать аккаунт" : t.auth_modal_title}</h3>
                                
                                <button onClick={handleGoogleAuth} className="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 rounded-xl mb-4 text-sm flex items-center justify-center gap-3">
                                    <span>{t.auth_google}</span>
                                </button>

                                <form onSubmit={handleAuth} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
                                        <input type="email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-medium text-slate-400">Пароль</label>
                                            <button type="button" onClick={generatePassword} className="text-[11px] text-indigo-400 hover:underline">{t.pwd_gen_btn}</button>
                                        </div>
                                        <input type="password" required value={authPassword} onChange={(e) => handlePasswordChange(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white" />
                                        
                                        {authPassword && (
                                            <div className="mt-2">
                                                <div className="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                                                    <div className={`h-full transition-all ${passwordScore <= 25 ? 'w-1/4 bg-rose-500' : passwordScore <= 50 ? 'w-2/4 bg-amber-500' : 'w-full bg-emerald-500'}`}></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    {authError && <p className="text-xs text-rose-400 bg-rose-950/40 p-2 rounded-lg">{authError}</p>}
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm">
                                        {isSignUp ? "Зарегистрироваться" : "Войти"}
                                    </button>
                                </form>
                                <div className="mt-4 text-center">
                                    <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-indigo-400 hover:underline">
                                        {isSignUp ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800 py-6 px-6 text-center text-xs text-slate-500">
                        CardCraft AI © 2026. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
