<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCraft AI — Part 3: Premium Vibe & Layout Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f9fafb; }
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.35; pointer-events: none; }
        .checkerboard {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .neon-glow { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.45)); }
        .podium-gradient {
            background: radial-gradient(circle at 50% 60%, #4c1d95 0%, #1e1b4b 40%, #090d16 85%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://zecwwgefsbpiadifnnuc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplY3d3Z2Vmc2JwaWFkaWZubnVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjM2MDMsImV4cCI6MjEwNDc5OTYwM30.PfH7zSMWJkzEhYg4qQ2OyASmQoElh3XzK3YwNc4_9Cg";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [credits, setCredits] = useState(() => {
                const saved = localStorage.getItem('cc_credits');
                return saved !== null ? parseInt(saved, 10) : 15;
            });
            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('cc_tab') || 'studio');
            
            const [processedImage, setProcessedImage] = useState(() => localStorage.getItem('cc_processed_img') || null);
            const [isProcessingImg, setIsProcessingImg] = useState(false);

            // Обновленная структура слайдов с вайбовыми характеристиками Aidentico
            const [generatedSeries, setGeneratedSeries] = useState(() => {
                const saved = localStorage.getItem('cc_series');
                return saved ? JSON.parse(saved) : [
                    {
                        badge: "🔥 ХИТ ПРОДАЖ 2026",
                        mainTitle: "ВЕНТИЛЯТОР",
                        subTitle: "ПРЕМИАЛЬНЫЙ 3D КОМФОРТ",
                        features: [
                            { icon: "⚡", title: "МОЩНОСТЬ", desc: "35W Turbo Air" },
                            { icon: "🔋", title: "АВТОНОМНОСТЬ", desc: "До 12 часов" }
                        ],
                        bullets: ["Гарантия премиум качества", "Ультратихий мотор 0dB", "Доставка по Узбекистану"],
                        bgUrl: "https://image.pollinations.ai/prompt/empty%20glowing%203d%20neon%20podium%20futuristic%20dark%20studio?width=900&height=1200&seed=101&nologo=true"
                    },
                    {
                        badge: "⚙️ ХАРАКТЕРИСТИКИ",
                        mainTitle: "МОЩНЫЙ И ТИХИЙ",
                        subTitle: "ИННОВАЦИОННЫЙ ОБДУВ",
                        features: [
                            { icon: "🔇", title: "ШУМ", desc: "Всего 15 дБ" },
                            { icon: "🌀", title: "ОБДУВ", desc: "360° Циркуляция" }
                        ],
                        bullets: ["3 режима скорости", "Управление с пультом", "Энергоэффективность A++"],
                        bgUrl: "https://image.pollinations.ai/prompt/empty%20cyan%20blue%20glowing%203d%20pedestal%20cyberpunk%20studio?width=900&height=1200&seed=202&nologo=true"
                    },
                    {
                        badge: "📦 КОМПЛЕКТАЦИЯ",
                        mainTitle: "ПОЛНЫЙ НАБОР",
                        subTitle: "ГОТОВО К ИСПОЛЬЗОВАНИЮ",
                        features: [
                            { icon: "🔌", title: "КАБЕЛЬ", desc: "USB Type-C 2m" },
                            { icon: "🛡️", title: "ГАРАНТИЯ", desc: "2 года сервиса" }
                        ],
                        bullets: ["Инструкция на русском", "Подарочная упаковка", "Кабель быстрой зарядки"],
                        bgUrl: "https://image.pollinations.ai/prompt/empty%20gold%20white%20marble%203d%20platform%20studio?width=900&height=1200&seed=303&nologo=true"
                    }
                ];
            });

            const [activeSlideIndex, setActiveSlideIndex] = useState(0);

            useEffect(() => {
                localStorage.setItem('cc_credits', credits.toString());
                localStorage.setItem('cc_tab', activeTab);
                if (processedImage) localStorage.setItem('cc_processed_img', processedImage);
                else localStorage.removeItem('cc_processed_img');
                localStorage.setItem('cc_series', JSON.stringify(generatedSeries));
            }, [credits, activeTab, processedImage, generatedSeries]);

            const removeBackgroundCanvas = (imageSrc) => {
                setIsProcessingImg(true);
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = imageSrc;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        if (r > 225 && g > 225 && b > 225) {
                            data[i + 3] = 0;
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    setProcessedImage(canvas.toDataURL('image/png'));
                    setIsProcessingImg(false);
                };
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => removeBackgroundCanvas(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const activeSlide = generatedSeries[activeSlideIndex] || generatedSeries[0];

            return (
                <div className="min-h-screen flex flex-col justify-between relative overflow-hidden">
                    <div className="bg-glow w-[600px] h-[600px] bg-purple-600 -top-40 -left-40"></div>

                    {/* Навигация */}
                    <header className="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('mixer')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-black text-white text-xl">
                                    C
                                </div>
                                <div>
                                    <span className="text-xl font-black text-white block leading-none">CardCraft AI</span>
                                    <span className="text-[10px] text-purple-400 font-bold uppercase">Aidentico Vibe v4.1</span>
                                </div>
                            </div>

                            <nav className="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                                <button 
                                    onClick={() => setActiveTab('mixer')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'mixer' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🪄 ИИ-Миксер
                                </button>
                                <button 
                                    onClick={() => setActiveTab('studio')}
                                    className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'studio' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    🖼️ 3D Студия ({generatedSeries.length})
                                </button>
                            </nav>

                            <div className="flex items-center gap-3">
                                <div className="bg-purple-950/80 border border-purple-800/60 px-4 py-2 rounded-xl text-xs font-bold text-purple-300">
                                    ⚡ {credits} Кредитов
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Рабочая область */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-6">
                        {activeTab === 'mixer' && (
                            <div className="max-w-3xl mx-auto bg-slate-900/90 border border-slate-800 p-8 rounded-3xl space-y-6">
                                <h2 className="text-xl font-black text-white">Загрузка фото товара</h2>
                                <div className="border-2 border-dashed border-slate-700 rounded-2xl p-6 text-center bg-slate-950/50">
                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" id="file-in" />
                                    <label htmlFor="file-in" className="cursor-pointer text-xs font-bold text-purple-400 hover:underline">
                                        Загрузить фото товара для идеального 3D-подиума
                                    </label>
                                </div>

                                {processedImage && (
                                    <div className="checkerboard p-4 rounded-2xl border border-slate-800 flex justify-center h-48">
                                        <img src={processedImage} alt="Cutout" className="max-h-full object-contain" />
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'studio' && (
                            <div className="space-y-6">
                                {/* Переключатель слайдов */}
                                <div className="flex items-center gap-3 justify-between bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                                    <div className="flex items-center gap-2">
                                        {generatedSeries.map((slide, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setActiveSlideIndex(idx)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeSlideIndex === idx ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/40' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                            >
                                                Слайд {idx + 1}
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => alert("Изображение готово к сохранению!")} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-600/30">
                                        📥 Скачать HD Карточку
                                    </button>
                                </div>

                                {/* Карточка Aidentico Compositor */}
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                    <div className="lg:col-span-6 flex justify-center">
                                        <div className="relative w-full max-w-[400px] aspect-[3/4] rounded-3xl overflow-hidden border border-purple-500/40 shadow-2xl shadow-purple-950/60 podium-gradient">
                                            
                                            {/* Слой 1: 3D Фон */}
                                            <img 
                                                src={activeSlide.bgUrl} 
                                                alt="3D Pedestal" 
                                                className="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-80"
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />

                                            {/* Неоновое свечение подиума (SVG) */}
                                            <div className="absolute bottom-12 left-1/2 -translate-x-1/2 w-72 h-20 bg-purple-500/30 blur-2xl rounded-full"></div>
                                            <div className="absolute bottom-16 left-1/2 -translate-x-1/2 w-56 h-8 bg-indigo-400/40 blur-xl rounded-full"></div>

                                            {/* Слой 2: Прозрачное Фото Товара */}
                                            {processedImage ? (
                                                <div className="absolute inset-0 flex items-center justify-center pb-8 z-10 pointer-events-none">
                                                    <img 
                                                        src={processedImage} 
                                                        alt="Product" 
                                                        className="max-h-[58%] max-w-[78%] object-contain filter drop-shadow-[0_25px_30px_rgba(0,0,0,0.95)]"
                                                    />
                                                </div>
                                            ) : (
                                                <div className="absolute inset-0 flex items-center justify-center text-slate-500 text-xs font-bold z-10">
                                                    [ Загрузите фото товара в Миксере ]
                                                </div>
                                            )}

                                            {/* Слой 3: Неоновые боковые плашки характеристик (Вайб Aidentico) */}
                                            <div className="absolute inset-0 z-20 flex flex-col justify-between p-5 pointer-events-none">
                                                
                                                {/* Верхняя шапка */}
                                                <div className="flex justify-between items-start">
                                                    <span className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-[11px] font-black px-3.5 py-1.5 rounded-xl uppercase tracking-wider shadow-lg shadow-purple-600/50 border border-purple-400/40">
                                                        {activeSlide.badge}
                                                    </span>
                                                    <span className="bg-slate-950/80 backdrop-blur-md border border-slate-700/80 text-amber-400 text-[10px] font-extrabold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-md">
                                                        ★ 4.9 Top Sale
                                                    </span>
                                                </div>

                                                {/* Боковые плавающие выноски характеристик */}
                                                {activeSlide.features && (
                                                    <div className="space-y-2 relative top-2">
                                                        {activeSlide.features.map((feat, i) => (
                                                            <div 
                                                                key={i} 
                                                                className={`inline-flex items-center gap-2.5 px-3 py-1.5 rounded-2xl bg-slate-950/85 backdrop-blur-lg border border-purple-500/40 shadow-xl neon-glow ${i % 2 === 1 ? 'ml-auto flex-row-reverse' : ''}`}
                                                            >
                                                                <span className="w-7 h-7 rounded-xl bg-purple-600/80 flex items-center justify-center text-xs">
                                                                    {feat.icon}
                                                                </span>
                                                                <div className="text-left">
                                                                    <div className="text-[9px] font-black text-purple-300 uppercase leading-none">{feat.title}</div>
                                                                    <div className="text-[11px] font-bold text-white leading-tight">{feat.desc}</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Нижняя монолитная инфографика */}
                                                <div className="bg-slate-950/90 backdrop-blur-xl border border-slate-800 p-4 rounded-2xl space-y-2 shadow-2xl">
                                                    <div>
                                                        <h3 className="text-lg font-black text-white leading-none uppercase tracking-wide">
                                                            {activeSlide.mainTitle}
                                                        </h3>
                                                        <p className="text-[10px] font-extrabold text-purple-400 uppercase tracking-widest mt-1">
                                                            {activeSlide.subTitle}
                                                        </p>
                                                    </div>

                                                    <div className="grid grid-cols-1 gap-1 pt-1 border-t border-slate-800/80">
                                                        {activeSlide.bullets.map((b, i) => (
                                                            <div key={i} className="flex items-center gap-2 text-[10px] text-slate-200 font-semibold">
                                                                <span className="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                                                                <span>{b}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                            </div>

                                        </div>
                                    </div>

                                    {/* Настройка текстов текущего слайда */}
                                    <div className="lg:col-span-6 bg-slate-900/80 border border-slate-800 p-6 rounded-3xl space-y-4">
                                        <h3 className="text-base font-bold text-white">Параметры Слайда #{activeSlideIndex + 1}</h3>
                                        <div className="space-y-3 text-xs">
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                                <span className="text-purple-400 font-bold block mb-1">Главный заголовок:</span>
                                                <span className="text-slate-100 font-bold text-sm">{activeSlide.mainTitle}</span>
                                            </div>
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                                                <span className="text-purple-400 font-bold block mb-1">Выноски характеристик:</span>
                                                <div className="grid grid-cols-2 gap-2 mt-2">
                                                    {activeSlide.features?.map((f, i) => (
                                                        <div key={i} className="p-2 bg-slate-900 rounded-lg border border-slate-800">
                                                            <span className="text-purple-300 font-bold">{f.icon} {f.title}:</span> {f.desc}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
                        CardCraft AI Engine © 2026.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
