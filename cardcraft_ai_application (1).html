  <style>

    .custom-scrollbar::-webkit-scrollbar-track {

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Environment and Config Setup
    const SUPABASE_URL = window.process?.env?.VITE_SUPABASE_URL || "https://zecwwgefsbpiadifnnuc.supabase.co";
    const SUPABASE_ANON_KEY = window.process?.env?.VITE_SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy";
    const GEMINI_API_KEY = window.process?.env?.VITE_GEMINI_API_KEY || "";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Dictionary for Localization
    const I18N = {

      },
      uz: {

        credits: "генерациялар",
        topUp: "Балансни тўлдириш",
        authTitle: "CardCraft Studiyasiga kirish",
        authSub: "Tizimga kirganingizda 3 ta bepul генерация oling",
        generateBtn: "Инфографика яратиш ✨",

        autoBg: "AI саҳна генерацияси",
        cleanBg: "Минимализм / Сариқ-кўк градиент",
        uploadPhoto: "Маҳсулот расмини юклаш",
        uploadSub: "PNG ёки JPG форматида",
        downloadCard: "PNG 4K юклаб олиш",
        saveToGallery: "Галереяга сақлаш",
        copySeo: "SEO матнни нусхалаш",
        creditsAlert: "Генерацияларингиз тугади! Давом этиш учун балансни тўлдиринг.",
        slidesHeader: "Тайёр карточка слайдлари",
        seoHeader: "Генерация қилинган SEO матни",
        editSlide: "Слайдни созлаш",
        preview: "Кўриб чиқиш",
        badges: "Афзалликлар бейжи",
        addBadge: "+ Бейж қўшиш",
        colorTheme: "Ранг мавзуси",
        quickPrompts: "Тезкор шаблонлар:",
        template1: "Электроника",
        template2: "Косметика",
        template3: "Уй ва ошхона",
      },
      en: {
        tagline: "AI E-Commerce Infographics & Visual Studio",
        credits: "credits",
        topUp: "Buy Credits",
        authTitle: "Sign in to CardCraft Studio",
        authSub: "Get 3 free generation credits instantly on signup",
        generateBtn: "Generate Infographics ✨",
        generating: "AI is designing your product cards...",
        studioTab: "Generator",
        canvasTab: "Studio Canvas",
        galleryTab: "My Gallery",
        pricingTab: "Pricing",
        prodTitle: "Product Title",
        prodTitlePlaceholder: "e.g., Ergonomic Thermal Tumbler 500ml",
        prodDesc: "Key Features & USPs",
        prodDescPlaceholder: "304 Stainless steel, 12h heat retention, leak-proof lid, non-slip base...",
        targetPlatform: "Marketplace",
        cardStyle: "Design Theme",
        bgMode: "Background Mode",
        autoBg: "AI Studio Environment",
        cleanBg: "Minimal Clean Accent",
        uploadPhoto: "Upload Product Image",
        uploadSub: "PNG or JPG with good contrast",
        downloadCard: "Download PNG",
        saveToGallery: "Save to Gallery",
        copySeo: "Copy SEO Text",
        creditsAlert: "You have used all your free credits! Top up to generate more cards.",
        slidesHeader: "Generated Card Slides",
        seoHeader: "Generated SEO Listing Text",
        editSlide: "Customize Slide",
        preview: "Live Preview",
        badges: "Feature Highlights",
        addBadge: "+ Add Highlight",
        colorTheme: "Color Accent",
        quickPrompts: "Quick Presets:",
        template1: "Electronics & Tech",
        template2: "Beauty & Personal Care",
        template3: "Home & Kitchen",
      }
    };

    function App() {
      // System & User State
      const [lang, setLang] = useState('ru');
      const [session, setSession] = useState(null);
      const [credits, setCredits] = useState(3);
      const [activeTab, setActiveTab] = useState('generator'); // 'generator', 'canvas', 'gallery', 'pricing'

      // Form Controls State
      const [productName, setProductName] = useState('');
      const [productDesc, setProductDesc] = useState('');
      const [platform, setPlatform] = useState('wildberries');
      const [styleTheme, setStyleTheme] = useState('cyberpunk');
      const [bgStyle, setBgStyle] = useState('ai_studio');
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);

      // Processing & Generation State
      const [loading, setLoading] = useState(false);
      const [generationStep, setGenerationStep] = useState('');
      const [result, setResult] = useState(null);
      const [aiGeneratedImage, setAiGeneratedImage] = useState(null);
      
      // Editor & Canvas State
      const [activeSlideIndex, setActiveSlideIndex] = useState(0);
      const [savedCards, setSavedCards] = useState([]);
      const [showPayModal, setShowPayModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authMsg, setAuthMsg] = useState('');

      const t = I18N[lang];
      const cardRef = useRef(null);

      useEffect(() => {
        // Initialize Lucide icons on render
        if (window.lucide) {
          window.lucide.createIcons();
        }

        // Supabase Auth listener
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchUserProfile(session.user.id);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) fetchUserProfile(session.user.id);
        });

        // Load saved local gallery items
        const localGallery = localStorage.getItem('cardcraft_gallery');
        if (localGallery) {
          try { setSavedCards(JSON.parse(localGallery)); } catch(e) {}
        }

        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, result, activeSlideIndex, showPayModal, showAuthModal]);

      async function fetchUserProfile(userId) {
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('credits')
            .eq('id', userId)
            .single();

          if (data && data.credits !== undefined) {
            setCredits(data.credits);
          }
        } catch (err) {
          console.log("Profile check using local session credits fallback.");
        }
      }

      async function handleGoogleAuth() {
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
          });
          if (error) alert("OAuth error: " + error.message);
        } catch (e) {
          alert("Could not trigger Google Auth in dev environment.");
        }
      }

      async function handleMagicLinkAuth(e) {
        e.preventDefault();
        setAuthMsg('Sending magic link...');
        try {
          const { error } = await supabase.auth.signInWithOtp({ email: authEmail });
          if (error) throw error;
          setAuthMsg('✨ Check your email inbox for the login link!');
        } catch (err) {
          setAuthMsg('Error: ' + err.message);
        }
      }

      function handleLogout() {
        supabase.auth.signOut();
        setSession(null);
        setCredits(3);
      }

      function handleImageUpload(e) {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setImagePreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      }

      function applyPreset(presetType) {
        if (presetType === 'tech') {
          setProductName('Беспроводные TWS Наушники Pro');
          setProductDesc('Активное шумоподавление ANC 35dB, 30 часов автономной работы, Bluetooth 5.3, влагозащита IPX5, прозрачный режим.');
          setPlatform('wildberries');
          setStyleTheme('neon_dark');
        } else if (presetType === 'beauty') {
          setProductName('Увлажняющая Сыворотка с Гиалуроновой Кислотой');
          setProductDesc('Глубокое питание 24 часа, пептидный комплекс, ниацинамид 5%, омолаживающий эффект, гипоаллергенно.');
          setPlatform('ozon');
          setStyleTheme('soft_pastel');
        } else if (presetType === 'home') {
          setProductName('Умный Увлажнитель Воздуха 4L');
          setProductDesc('Управление со смартфона Алиса/Tuya, УФ-стерилизация воды, сенсорное управление, ночной бесшумный режим 22дБ.');
          setPlatform('yandex');
          setStyleTheme('clean_modern');
        }
      }

      async function triggerAIGeneration(e) {
        e.preventDefault();

        if (credits <= 0) {
          setShowPayModal(true);
          return;
        }

        if (!productName || !productDesc) {
          alert('Заполните название и описание товара!');
          return;
        }

        setLoading(true);
        setGenerationStep('Анализируем характеристики товара...');

        // Deduct 1 credit
        const updatedCredits = Math.max(0, credits - 1);
        setCredits(updatedCredits);
        if (session) {
          supabase.from('profiles').update({ credits: updatedCredits }).eq('id', session.user.id).then();
        }

        try {
          // STEP 1: Text Generation using Gemini 3-Flash for infographics layout & copy
          setGenerationStep('Составляем маркетинговую инфографику и SEO...');
          
          const textPrompt = `Act as an expert e-commerce designer for marketplaces (${platform}). 
Create a detailed infographic structure for product: "${productName}".
Details: "${productDesc}".
Theme: "${styleTheme}".

Return ONLY a valid JSON object matching this schema:
{
  "cardTitle": "Catchy headline (max 5 words)",
  "seoDescription": "Engaging marketplace SEO text with relevant keywords.",
  "slides": [
    {
      "slideTitle": "Slide 1 Headline (e.g. ХИТ ПРОДАЖ)",
      "subtitle": "Short subtitle",
      "badges": ["USP Feature 1", "USP Feature 2", "USP Feature 3"],
      "accentColor": "#6366f1"
    },
    {
      "slideTitle": "Slide 2 Headline (Benefits)",
      "subtitle": "Key technology",
      "badges": ["USP Feature 4", "USP Feature 5", "USP Feature 6"],
      "accentColor": "#10b981"
    },
    {
      "slideTitle": "Slide 3 Headline (Specs & Gift)",
      "subtitle": "Complete set",
      "badges": ["USP Feature 7", "USP Feature 8", "USP Feature 9"],
      "accentColor": "#f59e0b"
    }
  ]
}`;

          let generatedData = null;

          try {
            const textApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
            const textResponse = await fetch(textApiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: textPrompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });

            if (textResponse.ok) {
              const resJson = await textResponse.json();
              const jsonText = resJson.candidates?.[0]?.content?.parts?.[0]?.text;
              if (jsonText) {
                generatedData = JSON.parse(jsonText);
              }
            }
          } catch (apiErr) {
            console.warn("Falling back to client-side rule engine for infographic content:", apiErr);
          }

          // Fallback structure if API key missing or offline
          if (!generatedData) {
            generatedData = {
              cardTitle: `${productName} — Премиум Качество`,
              seoDescription: `Купить ${productName} с бесплатной доставкой. ${productDesc}. Оригинальная продукция, гарантия качества, идеальный выбор для дома и подарка.`,
              slides: [
                {
                  slideTitle: "ХИТ ПРОДАЖ 2026",
                  subtitle: "Премиальная серия для маркетплейсов",
                  badges: ["Гарантия 2 Года", "Топовый Рейтинг 4.9★", "Быстрая Доставка"],
                  accentColor: "#6366f1"
                },
                {
                  slideTitle: "КЛЮЧЕВЫЕ ПРЕИМУЩЕСТВА",
                  subtitle: "Продуманные технологии комфорта",
                  badges: ["Эко-Материалы", "Повышенная Износостойкость", "Легкая Очистка"],
                  accentColor: "#10b981"
                },
                {
                  slideTitle: "КОМПЛЕКТАЦИЯ И ПОДАРОК",
                  subtitle: "Всё необходимое в одной коробке",
                  badges: ["Фирменная Коробка", "Инструкция на русском", "Подарок Внутри!"],
                  accentColor: "#f59e0b"
                }
              ]
            };
          }

          // STEP 2: Trigger AI Image background synthesis with Gemini 3.1 Flash Image Model
          setGenerationStep('Генерируем AI-студийный фон товара...');

          let generatedBgUri = null;
          try {
            const imgPrompt = `A high quality 3D render e-commerce product banner scene for ${productName}, commercial product photography studio lighting, ${styleTheme} background aesthetic, clean composition, ultra high definition, vibrant colors.`;
            
            const imageApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${GEMINI_API_KEY}`;
            const imagePayload = {
              contents: [{ parts: [{ text: imgPrompt }] }],
              generationConfig: {
                responseModalities: ['IMAGE'],
                imageConfig: { aspectRatio: "1:1" }
              }
            };

            const imgResponse = await fetch(imageApiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(imagePayload)
            });

            if (imgResponse.ok) {
              const imgData = await imgResponse.json();
              const b64Data = imgData?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
              if (b64Data) {
                generatedBgUri = `data:image/png;base64,${b64Data}`;
              }
            }
          } catch (imgErr) {
            console.warn("AI Image endpoint fallback used.", imgErr);
          }

          setAiGeneratedImage(generatedBgUri);
          setResult(generatedData);
          setActiveSlideIndex(0);
          setLoading(false);
          setActiveTab('canvas'); // Auto-switch to editor after generation

        } catch (err) {
          alert('Ошибка генерации: ' + err.message);
          setLoading(false);
        }
      }

      function downloadCardAsPNG() {
        if (!cardRef.current) return;
        
        html2canvas(cardRef.current, {
          scale: 3, // High resolution export
          useCORS: true,
          backgroundColor: null
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = `${productName.replace(/\s+/g, '_')}_slide_${activeSlideIndex + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      }

      function saveCardToGallery() {
        if (!result) return;
        const newCard = {
          id: Date.now(),
          title: productName || "Без названия",
          date: new Date().toLocaleDateString('ru-RU'),
          platform: platform,
          previewImage: imagePreview || aiGeneratedImage || 'https://placehold.co/400x400/1e293b/6366f1?text=Product+Card',
          data: result
        };
        const updated = [newCard, ...savedCards];
        setSavedCards(updated);
        localStorage.setItem('cardcraft_gallery', JSON.stringify(updated));
        alert(' Карточка успешно сохранена в вашу Галерею!');
      }

      return (
        <div className="min-h-screen flex flex-col gradient-glow">
          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-4 sm:px-8 py-3.5 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="sparkles" className="w-5 h-5 text-white"></i>
              </div>
              <div>
                <span className="text-xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                  CardCraft AI
                </span>
                <span className="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                  Studio 3.1
                </span>
              </div>
            </div>

            {/* Language Picker & Nav Links */}
            <div className="flex items-center gap-2 sm:gap-6">
              {/* Language Selector */}
              <div className="bg-slate-900 border border-slate-800 rounded-lg p-0.5 flex text-xs font-medium text-slate-400">
                {['ru', 'uz', 'en'].map((l) => (
                  <button
                    key={l}
                    onClick={() => setLang(l)}
                    className={`px-2.5 py-1 rounded-md transition ${lang === l ? 'bg-indigo-600 text-white font-bold' : 'hover:text-white'}`}
                  >
                    {l.toUpperCase()}
                  </button>
                ))}
              </div>

              {/* Credits Badge & User Profile */}
              <div className="flex items-center gap-3">
                <div 
                  onClick={() => setShowPayModal(true)}
                  className="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 px-3 py-1.5 rounded-xl cursor-pointer transition flex items-center gap-2"
                >
                  <i data-lucide="zap" className="w-4 h-4 text-emerald-400 fill-emerald-400/20"></i>
                  <span className="text-xs sm:text-sm font-bold text-emerald-400">{credits}</span>
                  <span className="text-xs text-slate-400 hidden sm:inline">{t.credits}</span>
                  <span className="text-xs bg-indigo-600/30 text-indigo-300 px-1.5 py-0.5 rounded font-bold ml-1">+</span>
                </div>

                {session ? (
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">
                      {session.user.email?.[0].toUpperCase() || 'U'}
                    </div>
                    <button
                      onClick={handleLogout}
                      className="text-slate-400 hover:text-rose-400 text-xs p-1"
                      title="Выйти"
                    >

                          <p className="text-xs text-slate-500">Создано: {item.date}</p>
                          <button
                            onClick={() => {
                              setResult(item.data);
                              setProductName(item.title);
                              setActiveTab('canvas');
                            }}
                            className="w-full mt-2 bg-slate-800 hover:bg-indigo-600 text-white text-xs font-semibold py-2 rounded-xl transition"
                          >
                            Открыть в Canvas
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {}
            {activeTab === 'pricing' && (
              <div className="max-w-4xl mx-auto space-y-8 py-4">
                <div className="text-center space-y-2">
                  <h2 className="text-2xl sm:text-3xl font-extrabold">Выберите Тариф CardCraft</h2>
                  <p className="text-slate-400 text-sm">Генерируйте сочные инфографики для маркетплейсов без лимитов</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* Starter */}
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-lg text-slate-200">Старт</h3>
                      <div className="text-3xl font-black text-white mt-2 mb-1">199 ₽</div>
                      <p className="text-xs text-slate-400">20 генераций карточек</p>
                      <ul className="mt-4 space-y-2 text-xs text-slate-300">
                        <li>✓ Все маркетплейсы</li>
                        <li>✓ Базовые AI-шаблоны</li>
                        <li>✓ Экспорт в PNG 4K</li>
                      </ul>
                    </div>
                    <button
                      onClick={() => setShowPayModal(true)}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl transition text-sm"
                    >
                      Купить пакет
                    </button>
                  </div>

                  {/* Pro Popular */}
                  <div className="bg-gradient-to-b from-indigo-950 to-slate-900 border-2 border-indigo-500 p-6 rounded-2xl space-y-4 flex flex-col justify-between relative shadow-xl shadow-indigo-500/10">
                    <span className="absolute -top-3 right-4 bg-indigo-500 text-white font-bold text-[10px] px-2.5 py-0.5 rounded-full uppercase">Популярный</span>
                    <div>
                      <h3 className="font-bold text-lg text-indigo-300">Pro Селлер</h3>
                      <div className="text-3xl font-black text-white mt-2 mb-1">699 ₽</div>
                      <p className="text-xs text-indigo-300">100 генераций карточек</p>
                      <ul className="mt-4 space-y-2 text-xs text-slate-200">
                        <li>✓ Удаление фона AI</li>
                        <li>✓ SEO Тексты для WB/Ozon</li>
                        <li>✓ Сохранение проектов</li>
                        <li>✓ Приоритетная генерация</li>
                      </ul>
                    </div>
                    <button
                      onClick={() => setShowPayModal(true)}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-md shadow-indigo-600/30"
                    >
                      Пополнить баланс
                    </button>
                  </div>

                  {/* Agency */}
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-lg text-slate-200">Безлимит</h3>
                      <div className="text-3xl font-black text-white mt-2 mb-1">1 990 ₽</div>
                      <p className="text-xs text-slate-400">500 генераций на месяц</p>
                      <ul className="mt-4 space-y-2 text-xs text-slate-300">
                        <li>✓ Для менеджеров маркетплейсов</li>
                        <li>✓ Персональные стили</li>
                        <li>✓ Поддержка 24/7</li>
                      </ul>
                    </div>
                    <button
                      onClick={() => setShowPayModal(true)}
                      className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl transition text-sm"
                    >
                      Подключить
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {}
          {/* Payment Modal */}
          {showPayModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold">Пополнение генераций</h3>
                  <button onClick={() => setShowPayModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                
                <div className="space-y-3">
                  <div className="p-4 bg-slate-950 border border-indigo-500/50 rounded-xl flex justify-between items-center cursor-pointer">
                    <div>
                      <div className="font-bold text-sm">100 генераций</div>
                      <div className="text-xs text-indigo-400">Выгодный выбор</div>
                    </div>
                    <span className="text-emerald-400 font-bold">699 ₽</span>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={() => {
                      setCredits(credits + 50);
                      setShowPayModal(false);
                      alert(' Баланс успешно пополнен на +50 генераций!');
                    }}
                    className="w-full py-3 bg-gradient-to-r from-emerald-600 to-indigo-600 hover:from-emerald-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl transition"
                  >
                    Симуляция оплаты (Тест)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Auth Modal */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold">{t.authTitle}</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-400">{t.authSub}</p>

                {/* Google Auth Option */}
                <button
                  onClick={handleGoogleAuth}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-sm"
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                  </svg>
                  Войти через Google
                </button>

                <div className="flex items-center gap-2 text-xs text-slate-500">
                  <div className="h-px bg-slate-800 flex-1"></div>
                  <span>или по ссылке</span>
                  <div className="h-px bg-slate-800 flex-1"></div>
                </div>

                <form onSubmit={handleMagicLinkAuth} className="space-y-3">
                  <input
                    type="email"
                    required
                    placeholder="Ваш email адрес"
                    value={authEmail}
                    onChange={(e) => setAuthEmail(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                  <button
                    type="submit"
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-sm"
                  >
                    Войти по Email
                  </button>
                </form>

                {authMsg && <p className="text-xs text-indigo-400 text-center">{authMsg}</p>}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
